<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>scorpTIMER</title>
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="apple-mobile-web-app-title" content="scorpTIMER">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="logo3.png">
    <style>
        :root {
            --color-team-a: #e63946;
            --color-team-b: #0066ff;
            --color-team-c: #2ecc71;
            --color-team-d: #f39c12;
            --bg: #0a0a10;
            --surface: #1a1a26;
            --text: #ffffff;
            --gold: #f4a261;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif; touch-action: manipulation; display: flex; flex-direction: column; }

        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; background: var(--surface); border-bottom: 2px solid rgba(255,255,255,0.08); flex-shrink: 0; z-index: 10; flex-wrap: nowrap; }
        .game-timer-box { display: flex; align-items: center; gap: 6px; background: #00000033; border-radius: 30px; padding: 4px 12px; backdrop-filter: blur(8px); }
        .game-timer-label { font-size: 0.75rem; letter-spacing: 1.5px; color: #aaa; font-weight: 600; text-transform: uppercase; }
        .game-timer-display { font-family: 'JetBrains Mono', monospace; font-size: 1.6rem; font-weight: 700; color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.3); min-width: 72px; text-align: center; }
        .game-timer-display.warning { color: #e76f51; animation: pulse-warn 0.7s infinite; }
        .btn-icon { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; font-size: 1.3rem; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; backdrop-filter: blur(4px); flex-shrink: 0; }
        .btn-icon:hover { background: rgba(255,255,255,0.2); }
        .btn-icon:active { transform: scale(0.92); }
        .btn-icon.active { background: var(--gold); border-color: var(--gold); color: #000; }
        .topbar-buttons { display: flex; gap: 6px; align-items: center; }

        .main-arena { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 4px; min-height: 0; }
        .team-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 18px; cursor: pointer; transition: 0.2s; border: 3px solid rgba(255,255,255,0.25); position: relative; overflow: hidden; box-shadow: inset 0 0 50px rgba(0,0,0,0.6); min-height: 0; }
        .team-panel:active { transform: scale(0.97); }
        .team-panel.inactive-for-start { cursor: default; filter: grayscale(0.4); }
        .team-panel.inactive-for-start:active { transform: none; }
        .dim-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1; }
        .team-panel.dimmed .dim-overlay { opacity: 1; }
        .team-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 8px; width: 100%; }
        .team-name { font-size: clamp(1.4rem, 5vw, 2.4rem); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #ffffff; text-shadow: 3px 3px 10px rgba(0,0,0,0.9), 0 0 15px rgba(0,0,0,0.8); white-space: nowrap; }
        .team-time { font-family: 'JetBrains Mono', monospace; font-size: clamp(2.8rem, 10vw, 6rem); font-weight: 900; color: #ffffff; text-shadow: 3px 3px 12px rgba(0,0,0,0.9), 0 0 25px rgba(0,0,0,0.8); line-height: 1; }
        .team-status { font-size: clamp(0.9rem, 2.5vw, 1.4rem); font-weight: 700; letter-spacing: 1px; background: rgba(0,0,0,0.7); padding: 6px 18px; border-radius: 30px; color: #ffffff; text-shadow: 2px 2px 6px rgba(0,0,0,0.9); backdrop-filter: blur(4px); white-space: nowrap; max-width: 95%; overflow: hidden; text-overflow: ellipsis; }
        .team-panel.active-holder { animation: activeGlow 1.2s infinite; border-color: rgba(255, 255, 255, 0.7); }
        @keyframes activeGlow { 0%,100% { box-shadow: 0 0 30px rgba(255,255,255,0.6), inset 0 0 30px rgba(0,0,0,0.4); } 50% { box-shadow: 0 0 60px rgba(255,255,255,0.8), inset 0 0 50px rgba(255,255,255,0.15); } }

        /* Обводка */
        .hold-border { position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: 18px; }
        .hold-line { position: absolute; background: #ffffff; box-shadow: 0 0 10px 3px var(--hold-glow, rgba(255,255,255,0.9)); }
        .hold-line-top { top: 0; left: 0; height: 6px; width: 0%; }
        .hold-line-right { top: 0; right: 0; width: 6px; height: 0%; }
        .hold-line-bottom { bottom: 0; right: 0; height: 6px; width: 0%; }
        .hold-line-left { bottom: 0; left: 0; width: 6px; height: 0%; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal { background: var(--surface); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 24px 20px; max-width: 450px; width: 90%; display: flex; flex-direction: column; gap: 16px; }
        .modal h2 { text-align: center; font-size: 1.3rem; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .setting-row label { font-weight: 600; font-size: 0.9rem; color: #ccc; flex: 1; }
        .setting-row input[type="number"], .setting-row input[type="text"], .setting-row input[type="password"], .setting-row select { background: #0f0f17; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 10px; border-radius: 14px; font-size: 1rem; font-weight: 700; text-align: center; width: 110px; }
        .setting-row input[type="range"] { width: 120px; accent-color: var(--gold); }
        .setting-row select { width: 130px; }
        .setting-row input[type="text"]:read-only { opacity: 0.7; background: #1a1a24; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .modal-footer { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0 4px; opacity: 0.7; }
        .modal-footer .donate-line { display: flex; align-items: center; gap: 6px; }
        .modal-footer .credit-line { display: flex; align-items: center; gap: 8px; }
        .modal-footer img { height: 24px; width: 24px; object-fit: contain; }
        .modal-footer .credit-line span { font-size: 0.7rem; color: #aaa; letter-spacing: 0.5px; }
        .donate-link { display: inline-flex; align-items: center; gap: 6px; color: #e76f51; text-decoration: none; font-size: 0.75rem; font-weight: 600; padding: 4px 12px; border: 1px solid rgba(231,111,81,0.4); border-radius: 15px; transition: 0.2s; }
        .donate-link:hover { background: rgba(231,111,81,0.2); border-color: #e76f51; }
        .donate-heart { font-size: 1.1rem; animation: heartbeat 1.2s infinite; display: inline-block; }
        @keyframes heartbeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .btn { padding: 10px 20px; border-radius: 30px; border: none; font-weight: 700; font-size: 0.9rem; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn.primary { background: var(--gold); color: #000; border-color: var(--gold); }
        .btn.danger { background: #e63946; border-color: #e63946; }
        .hidden { display: none; }
        @keyframes pulse-warn { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

        .password-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 300; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .password-overlay.active { opacity: 1; pointer-events: auto; }
        .password-box { background: var(--surface); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 16px; width: 90%; max-width: 320px; }
        .password-box h3 { font-size: 1.2rem; }
        .password-box input { background: #0f0f17; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 12px; border-radius: 14px; font-size: 1.5rem; text-align: center; letter-spacing: 8px; font-weight: 700; }
        .password-box .pass-buttons { display: flex; gap: 8px; justify-content: center; }
        .password-box .pass-buttons button { flex: 1; padding: 10px; border-radius: 14px; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; }
        .password-box .pass-buttons .pass-ok { background: var(--gold); color: #000; }
        .password-box .pass-buttons .pass-cancel { background: rgba(255,255,255,0.1); color: #fff; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="game-timer-box">
            <span class="game-timer-label">⏱ МАТЧ</span>
            <span class="game-timer-display" id="gameTimerDisplay">10:00</span>
        </div>
        <div class="topbar-buttons">
            <button class="btn-icon" id="btnPlayPause" title="Старт / Пауза">▶</button>
            <button class="btn-icon" id="btnReset" title="Сбросить матч">↺</button>
            <button class="btn-icon" id="btnSettings" title="Настройки">⚙️</button>
            <button class="btn-icon" id="btnEndGame" title="Завершить игру (остановить сирену)" style="display:none; background:#e76f51;">🔔</button>
        </div>
    </div>

    <div class="main-arena" id="mainArena"></div>

    <div class="password-overlay" id="passwordOverlay">
        <div class="password-box">
            <h3>🔐 Введите пароль</h3>
            <input type="password" id="passwordInput" placeholder="••••••" maxlength="6" inputmode="numeric">
            <div class="pass-buttons">
                <button class="pass-cancel" id="passCancel">✖ Отмена</button>
                <button class="pass-ok" id="passOk">✅ ОК</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>⚙️ Настройки</h2>
            <div class="setting-row"><label>⏳ Длительность матча (мин)</label><input type="number" id="inputMatchMin" value="10" min="1" max="120"></div>
            <div class="setting-row"><label>👥 Количество команд</label><select id="inputTeamCount"><option value="2">2 команды</option><option value="3">3 команды</option><option value="4">4 команды</option></select></div>
            <div class="setting-row"><label>⏱ Удержание (сек): <span id="holdSecondsLabel">0</span></label><input type="range" id="inputHoldSeconds" min="0" max="10" value="0" step="1"></div>
            <div class="setting-row"><label>🔐 Кодовый замок</label><input type="password" id="inputLockCode" placeholder="Пусто = выкл" maxlength="6" inputmode="numeric" style="width:120px;"></div>
            <div id="teamSettings">
                <div class="setting-row"><label>🔴 Команда A</label><select id="inputColorA"><option value="#e63946">Красные</option><option value="#0066ff">Синие</option><option value="#ffffff">Белые</option><option value="#2ecc71">Зелёные</option><option value="#f39c12">Оранжевые</option><option value="#f1c40f">Жёлтые</option></select></div>
                <div class="setting-row"><label>🔵 Команда B</label><select id="inputColorB"><option value="#e63946">Красные</option><option value="#0066ff" selected>Синие</option><option value="#ffffff">Белые</option><option value="#2ecc71">Зелёные</option><option value="#f39c12">Оранжевые</option><option value="#f1c40f">Жёлтые</option></select></div>
                <div id="teamCPanel" class="hidden">
                    <div class="setting-row"><label>🟢 Команда C</label><select id="inputColorC"><option value="#e63946">Красные</option><option value="#0066ff">Синие</option><option value="#ffffff">Белые</option><option value="#2ecc71" selected>Зелёные</option><option value="#f39c12">Оранжевые</option><option value="#f1c40f">Жёлтые</option></select></div>
                </div>
                <div id="teamDPanel" class="hidden">
                    <div class="setting-row"><label>🟠 Команда D</label><select id="inputColorD"><option value="#e63946">Красные</option><option value="#0066ff">Синие</option><option value="#ffffff">Белые</option><option value="#2ecc71">Зелёные</option><option value="#f39c12" selected>Оранжевые</option><option value="#f1c40f">Жёлтые</option></select></div>
                </div>
            </div>
            <div class="modal-actions"><button class="btn primary" id="btnSaveSettings">💾 Сохранить</button><button class="btn danger" id="btnCloseSettings">✖ Закрыть</button></div>
            <div class="modal-footer">
                <div class="donate-line">
                    <a class="donate-link" href="https://www.tbank.ru/cf/1MigoYhAzjz" target="_blank"><span class="donate-heart">♥️</span> поддержать проект любой суммой</a>
                </div>
                <div class="credit-line">
                    <img src="logo6.png" alt="logo"><span>created by XAH СК Скорпион (Сочи)</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) { window.addEventListener('load', function() { navigator.serviceWorker.register('sw.js').catch(function() {}); }); }

        (function() {
            var state = {
                matchDuration: 600, timeLeft: 600, matchActive: false, ended: false, currentHolder: null,
                times: { A: 0, B: 0, C: 0, D: 0 }, teamCount: 2,
                teamNames: { A: 'КРАСНЫЕ', B: 'СИНИЕ', C: 'ЗЕЛЁНЫЕ', D: 'ОРАНЖЕВЫЕ' },
                teamColors: { A: '#e63946', B: '#0066ff', C: '#2ecc71', D: '#f39c12' },
                lastTick: null, tickInterval: null, audioCtx: null, buffers: {}, activeSirenNode: null,
                audioLoaded: false, warningPlayed: false, warning1minPlayed: false, tenMinPlayed: false, fiveMinPlayed: false,
                holdSeconds: 0, lockCode: '', holdTimer: null, holdStart: null, pendingTeam: null, passTargetTeam: null,
                zahvatAudio: null
            };

            var mainArena = document.getElementById('mainArena'), gameTimerDisplay = document.getElementById('gameTimerDisplay'),
                btnPlayPause = document.getElementById('btnPlayPause'), btnReset = document.getElementById('btnReset'),
                btnSettings = document.getElementById('btnSettings'), btnEndGame = document.getElementById('btnEndGame'),
                modalOverlay = document.getElementById('modalOverlay'), inputMatchMin = document.getElementById('inputMatchMin'),
                inputTeamCount = document.getElementById('inputTeamCount'), inputHoldSeconds = document.getElementById('inputHoldSeconds'),
                holdSecondsLabel = document.getElementById('holdSecondsLabel'), inputLockCode = document.getElementById('inputLockCode'),
                inputColorA = document.getElementById('inputColorA'), inputColorB = document.getElementById('inputColorB'),
                inputColorC = document.getElementById('inputColorC'), inputColorD = document.getElementById('inputColorD'),
                teamCPanel = document.getElementById('teamCPanel'), teamDPanel = document.getElementById('teamDPanel'),
                btnSaveSettings = document.getElementById('btnSaveSettings'), btnCloseSettings = document.getElementById('btnCloseSettings'),
                passwordOverlay = document.getElementById('passwordOverlay'), passwordInput = document.getElementById('passwordInput'),
                passOk = document.getElementById('passOk'), passCancel = document.getElementById('passCancel'), panels = {};

            inputHoldSeconds.addEventListener('input', function() { holdSecondsLabel.textContent = this.value; });

            function getAudioContext() { if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (state.audioCtx.state === 'suspended') state.audioCtx.resume(); return state.audioCtx; }
            function loadAudioFile(url, cb) { fetch(url).then(function(r) { return r.ok ? r.arrayBuffer() : null; }).then(function(b) { return b ? getAudioContext().decodeAudioData(b) : null; }).then(function(d) { if (d && cb) cb(url, d); }); }
            function preloadAudioFiles() { if (state.audioLoaded) return; 
                ['siren.mp3','siren1.mp3','siren2.mp3','siren3.mp3','start.mp3','kras.mp3','sinie.mp3','zelen.mp3','zeltie.mp3','bel.mp3','orange.mp3','zahvat.mp3'].forEach(function(f) { loadAudioFile(f, function(n, b) { state.buffers[n] = b; }); }); 
                setTimeout(function() { state.audioLoaded = true; }, 3000); }
            function getSoundForColor(hex) { hex = hex.replace('#','').toLowerCase(); var r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16); if (r > 200 && g > 80 && g < 180 && b < 100) return 'orange.mp3'; if (r > 200 && g > 180 && b < 100) return 'zeltie.mp3'; if (r > 200 && g > 200 && b > 200) return 'bel.mp3'; if (r > g && r > b) return 'kras.mp3'; if (b > r && b > g) return 'sinie.mp3'; if (g > r && g > b) return 'zelen.mp3'; return 'kras.mp3'; }
            function playBuffer(buf, loop) { if (!buf) return; var ctx = getAudioContext(), src = ctx.createBufferSource(); src.buffer = buf; src.loop = !!loop; src.connect(ctx.destination); src.start(0); return src; }
            function playCaptureSound(color) { if (!state.audioLoaded) return; var f = getSoundForColor(color); if (state.buffers[f]) playBuffer(state.buffers[f], false); }
            function startZahvatSound() { stopZahvatSound(); if (state.buffers['zahvat.mp3']) { state.zahvatAudio = playBuffer(state.buffers['zahvat.mp3'], true); } }
            function stopZahvatSound() { if (state.zahvatAudio) { try { state.zahvatAudio.stop(); } catch(e) {} state.zahvatAudio = null; } }
            function startSiren() { stopSiren(); if (state.buffers['siren.mp3']) state.activeSirenNode = playBuffer(state.buffers['siren.mp3'], true); }
            function stopSiren() { if (state.activeSirenNode) { try { state.activeSirenNode.stop(); } catch(e) {} state.activeSirenNode = null; } }

            function playTick() { if (!state.audioLoaded) return; try { var ctx = getAudioContext(), now = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square'; o.frequency.setValueAtTime(800, now); g.gain.setValueAtTime(0.15, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.05); o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + 0.06); } catch(e) {} }
            var tickTimer = null;
            function startTickSound() { stopTickSound(); if (state.matchActive && state.currentHolder && state.audioLoaded) { playTick(); tickTimer = setInterval(function() { if (state.matchActive && state.currentHolder) playTick(); else stopTickSound(); }, 1000); } }
            function stopTickSound() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }

            function formatTime(sec) { var m = Math.floor(sec/60), s = Math.floor(sec%60); return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
            function getWinningTeam() { var mx = null, mt = -1; ['A','B','C','D'].forEach(function(t) { if (state.times[t] > mt) { mt = state.times[t]; mx = t; } }); return mx; }
            function updateUI() {
                gameTimerDisplay.textContent = formatTime(state.timeLeft); gameTimerDisplay.classList.toggle('warning', state.matchActive && state.timeLeft<=60 && state.timeLeft>0);
                var teams = ['A','B','C','D'].slice(0, state.teamCount);
                teams.forEach(function(t) {
                    var p = panels[t]; if (!p) return;
                    p.querySelector('.team-name').textContent = state.teamNames[t]; p.style.backgroundColor = state.teamColors[t];
                    p.querySelector('.team-time').textContent = formatTime(state.times[t]);
                    var txt = 'ОЖИДАЙТЕ СТАРТА';
                    if (state.ended) { var w = getWinningTeam(); txt = (t===w&&w)?'🏆 ПОБЕДИТЕЛЬ':''; }
                    else if (state.matchActive) txt = state.currentHolder===t ? '⚡ УДЕРЖАНИЕ' : (state.holdSeconds > 0 ? 'УДЕРЖИВАЙТЕ '+state.holdSeconds+' сек' : 'НАЖМИТЕ ДЛЯ ЗАХВАТА');
                    p.querySelector('.team-status').textContent = txt;
                    p.classList.remove('active-holder','dimmed','inactive-for-start');
                    if (!state.matchActive && !state.ended) p.classList.add('inactive-for-start');
                    if (state.matchActive && !state.ended) { if (state.currentHolder===t) p.classList.add('active-holder'); else if (state.currentHolder) p.classList.add('dimmed'); }
                });
                btnEndGame.style.display = state.ended ? 'flex' : 'none';
                btnPlayPause.textContent = state.matchActive ? '⏸' : '▶';
                if (state.matchActive) btnPlayPause.classList.add('active'); else btnPlayPause.classList.remove('active');
            }

            function checkPassword(team) { if (!state.lockCode) { doCapture(team); return; } state.passTargetTeam = team; passwordInput.value = ''; passwordOverlay.classList.add('active'); setTimeout(function() { passwordInput.focus(); }, 100); }
            passOk.addEventListener('click', function() { var entered = passwordInput.value.trim(); passwordOverlay.classList.remove('active'); if (entered === state.lockCode && state.passTargetTeam) { doCapture(state.passTargetTeam); } state.passTargetTeam = null; });
            passCancel.addEventListener('click', function() { passwordOverlay.classList.remove('active'); state.passTargetTeam = null; });
            passwordInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { passOk.click(); } });

            function createHoldBorder(panel) {
                var border = panel.querySelector('.hold-border');
                if (!border) { border = document.createElement('div'); border.className = 'hold-border'; ['top','right','bottom','left'].forEach(function(side) { var line = document.createElement('div'); line.className = 'hold-line hold-line-' + side; border.appendChild(line); }); panel.appendChild(border); }
                return { top: border.querySelector('.hold-line-top'), right: border.querySelector('.hold-line-right'), bottom: border.querySelector('.hold-line-bottom'), left: border.querySelector('.hold-line-left') };
            }

            function startHold(team) {
                if (!state.matchActive || state.ended) return;
                if (state.currentHolder === team) return;
                state.pendingTeam = team; state.holdStart = Date.now();
                var panel = panels[team]; var border = createHoldBorder(panel);
                var glow = state.teamColors[team];
                border.top.style.boxShadow = '0 0 12px 4px ' + glow;
                border.right.style.boxShadow = '0 0 12px 4px ' + glow;
                border.bottom.style.boxShadow = '0 0 12px 4px ' + glow;
                border.left.style.boxShadow = '0 0 12px 4px ' + glow;
                border.top.style.width = '0%'; border.right.style.height = '0%'; border.bottom.style.width = '0%'; border.left.style.height = '0%';
                startZahvatSound();
                if (state.holdTimer) clearInterval(state.holdTimer);
                var holdMs = state.holdSeconds * 1000;
                state.holdTimer = setInterval(function() {
                    var elapsed = Date.now() - state.holdStart; var pct = Math.min(1, elapsed / holdMs); var quarter = pct * 4;
                    if (quarter <= 1) { border.top.style.width = (quarter*100) + '%'; border.right.style.height = '0%'; border.bottom.style.width = '0%'; border.left.style.height = '0%'; }
                    else if (quarter <= 2) { border.top.style.width = '100%'; border.right.style.height = ((quarter-1)*100) + '%'; border.bottom.style.width = '0%'; border.left.style.height = '0%'; }
                    else if (quarter <= 3) { border.top.style.width = '100%'; border.right.style.height = '100%'; border.bottom.style.width = ((quarter-2)*100) + '%'; border.left.style.height = '0%'; }
                    else { border.top.style.width = '100%'; border.right.style.height = '100%'; border.bottom.style.width = '100%'; border.left.style.height = ((quarter-3)*100) + '%'; }
                    if (elapsed >= holdMs) { clearInterval(state.holdTimer); state.holdTimer = null; border.top.style.width = '0%'; border.right.style.height = '0%'; border.bottom.style.width = '0%'; border.left.style.height = '0%'; stopZahvatSound(); checkPassword(team); state.pendingTeam = null; }
                }, 100);
            }
            function cancelHold(team) {
                if (state.holdTimer) { clearInterval(state.holdTimer); state.holdTimer = null; }
                if (state.pendingTeam === team) state.pendingTeam = null;
                var panel = panels[team];
                if (panel) { var b = panel.querySelector('.hold-line-top'); if (b) { b.style.width = '0%'; panel.querySelector('.hold-line-right').style.height = '0%'; panel.querySelector('.hold-line-bottom').style.width = '0%'; panel.querySelector('.hold-line-left').style.height = '0%'; } }
                stopZahvatSound();
            }
            function doCapture(team) { if (state.ended || !state.matchActive || state.currentHolder === team) return; state.currentHolder = team; playCaptureSound(state.teamColors[team]); startTickSound(); updateUI(); }
            function onPanelDown(team) { if (!state.matchActive || state.ended) return; if (state.holdSeconds > 0) startHold(team); else checkPassword(team); }
            function onPanelUp(team) { if (state.holdSeconds > 0) cancelHold(team); }

            function proceedStartMatch() { state.matchActive = true; state.warningPlayed = false; state.warning1minPlayed = false; state.tenMinPlayed = false; state.fiveMinPlayed = false; state.lastTick = Date.now(); if (!state.tickInterval) state.tickInterval = setInterval(gameTick, 100); updateUI(); }
            function startMatch() { if (state.ended) resetMatch(); if (!state.audioLoaded) { preloadAudioFiles(); setTimeout(proceedStartMatch, 500); } else proceedStartMatch(); }
            function pauseMatch() { state.matchActive = false; stopTickSound(); stopSiren(); updateUI(); }
            function toggleMatch() { if (state.ended) return; state.matchActive ? pauseMatch() : startMatch(); }
            function resetMatch() { pauseMatch(); state.timeLeft = state.matchDuration; state.ended = false; state.currentHolder = null; state.times = { A:0,B:0,C:0,D:0 }; state.warningPlayed = false; state.warning1minPlayed = false; state.tenMinPlayed = false; state.fiveMinPlayed = false; stopSiren(); if (state.tickInterval) { clearInterval(state.tickInterval); state.tickInterval = null; } updateUI(); btnEndGame.style.display = 'none'; }
            function endMatchByTimer() { state.matchActive = false; state.ended = true; state.currentHolder = null; stopTickSound(); startSiren(); updateUI(); }
            function finishGame() { stopSiren(); state.ended = false; state.currentHolder = null; updateUI(); }
            function gameTick() {
                var now = Date.now(); if (!state.matchActive || !state.lastTick) { state.lastTick = now; return; }
                var d = (now - state.lastTick) / 1000; if (d <= 0) return;
                var prev = state.timeLeft; state.timeLeft -= d;
                var elapsed = state.matchDuration - state.timeLeft, prevElapsed = state.matchDuration - prev;
                if (state.matchDuration >= 900 && prevElapsed < 300 && elapsed >= 300 && !state.fiveMinPlayed && state.timeLeft > 0) { state.fiveMinPlayed = true; if (state.buffers['start.mp3']) playBuffer(state.buffers['start.mp3'], false); }
                if (prev > 600 && state.timeLeft <= 600 && !state.tenMinPlayed && state.timeLeft > 0) { state.tenMinPlayed = true; if (state.buffers['siren3.mp3']) playBuffer(state.buffers['siren3.mp3'], false); }
                if (prev > 300 && state.timeLeft <= 300 && !state.warningPlayed && state.timeLeft > 0) { state.warningPlayed = true; if (state.buffers['siren1.mp3']) playBuffer(state.buffers['siren1.mp3'], false); }
                if (prev > 60 && state.timeLeft <= 60 && !state.warning1minPlayed && state.timeLeft > 0) { state.warning1minPlayed = true; if (state.buffers['siren2.mp3']) playBuffer(state.buffers['siren2.mp3'], false); }
                if (state.timeLeft <= 0) { state.timeLeft = 0; endMatchByTimer(); return; }
                if (state.currentHolder) state.times[state.currentHolder] += d;
                state.lastTick = now; updateUI();
            }

            function renderPanels() {
                mainArena.innerHTML = ''; panels = {};
                for (var i = 0; i < state.teamCount; i++) {
                    var team = String.fromCharCode(65+i);
                    var panel = document.createElement('div'); panel.className = 'team-panel inactive-for-start'; panel.style.backgroundColor = state.teamColors[team];
                    panel.innerHTML = '<div class="dim-overlay"></div><div class="team-content"><div class="team-name">'+state.teamNames[team]+'</div><div class="team-time" id="time'+team+'">00:00</div><div class="team-status" id="status'+team+'">ОЖИДАЙТЕ СТАРТА</div></div>';
                    panel.addEventListener('mousedown', (function(t) { return function(e) { e.preventDefault(); onPanelDown(t); }; })(team));
                    panel.addEventListener('mouseup', (function(t) { return function(e) { onPanelUp(t); }; })(team));
                    panel.addEventListener('mouseleave', (function(t) { return function(e) { onPanelUp(t); }; })(team));
                    panel.addEventListener('touchstart', (function(t) { return function(e) { e.preventDefault(); onPanelDown(t); }; })(team), {passive: false});
                    panel.addEventListener('touchend', (function(t) { return function(e) { onPanelUp(t); }; })(team));
                    panel.addEventListener('touchcancel', (function(t) { return function(e) { onPanelUp(t); }; })(team));
                    mainArena.appendChild(panel); panels[team] = panel;
                }
            }

            function getColorName(hex) {
                var colors = { '#e63946': 'КРАСНЫЕ', '#0066ff': 'СИНИЕ', '#ffffff': 'БЕЛЫЕ', '#2ecc71': 'ЗЕЛЁНЫЕ', '#f39c12': 'ОРАНЖЕВЫЕ', '#f1c40f': 'ЖЁЛТЫЕ' };
                return colors[hex] || 'КОМАНДА';
            }

            inputTeamCount.addEventListener('change', function() { var v = parseInt(inputTeamCount.value); teamCPanel.classList.toggle('hidden', v < 3); teamDPanel.classList.toggle('hidden', v < 4); });
            function openSettings() {
                inputMatchMin.value = Math.round(state.matchDuration/60); inputTeamCount.value = state.teamCount;
                inputHoldSeconds.value = state.holdSeconds; holdSecondsLabel.textContent = state.holdSeconds;
                inputLockCode.value = state.lockCode;
                inputColorA.value = state.teamColors.A; inputColorB.value = state.teamColors.B;
                inputColorC.value = state.teamColors.C; inputColorD.value = state.teamColors.D;
                teamCPanel.classList.toggle('hidden', state.teamCount < 3); teamDPanel.classList.toggle('hidden', state.teamCount < 4); modalOverlay.classList.add('open');
            }
            function closeSettings() { modalOverlay.classList.remove('open'); }
            function saveSettings() {
                var mins = parseInt(inputMatchMin.value); if (isNaN(mins) || mins<1) mins = 10; state.matchDuration = mins*60; state.teamCount = parseInt(inputTeamCount.value);
                state.teamColors.A = inputColorA.value; state.teamNames.A = getColorName(state.teamColors.A);
                state.teamColors.B = inputColorB.value; state.teamNames.B = getColorName(state.teamColors.B);
                if (state.teamCount >= 3) { state.teamColors.C = inputColorC.value; state.teamNames.C = getColorName(state.teamColors.C); }
                if (state.teamCount >= 4) { state.teamColors.D = inputColorD.value; state.teamNames.D = getColorName(state.teamColors.D); }
                state.holdSeconds = parseInt(inputHoldSeconds.value) || 0; state.lockCode = inputLockCode.value.trim();
                localStorage.setItem('appSettings', JSON.stringify({ teamCount: state.teamCount, names: state.teamNames, colors: state.teamColors, matchDuration: state.matchDuration, holdSeconds: state.holdSeconds, lockCode: state.lockCode }));
                renderPanels(); resetMatch(); closeSettings(); updateUI();
            }
            function loadSettings() {
                var saved = localStorage.getItem('appSettings');
                if (saved) { try { var d = JSON.parse(saved); state.teamCount = d.teamCount || 2; state.teamNames = d.names || state.teamNames; state.teamColors = d.colors || state.teamColors; state.matchDuration = d.matchDuration || 600; state.holdSeconds = d.holdSeconds || 0; state.lockCode = d.lockCode || ''; } catch(e) {} }
                state.timeLeft = state.matchDuration;
            }

            btnPlayPause.addEventListener('click', toggleMatch); btnReset.addEventListener('click', resetMatch); btnSettings.addEventListener('click', openSettings); btnEndGame.addEventListener('click', finishGame);
            btnSaveSettings.addEventListener('click', saveSettings); btnCloseSettings.addEventListener('click', closeSettings);
            modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) closeSettings(); });
            window.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
                if (e.key === 'a') { checkPassword('A'); e.preventDefault(); } if (e.key === 'b') { checkPassword('B'); e.preventDefault(); }
                if (e.key === 'c' && state.teamCount >= 3) { checkPassword('C'); e.preventDefault(); } if (e.key === 'd' && state.teamCount >= 4) { checkPassword('D'); e.preventDefault(); }
                if (e.key === ' ') { toggleMatch(); e.preventDefault(); } if (e.key === 'r') { resetMatch(); e.preventDefault(); }
                if (e.key === 's') { openSettings(); e.preventDefault(); } if (e.key === 'Escape') { closeSettings(); }
            });

            loadSettings(); renderPanels(); updateUI(); preloadAudioFiles();
        })();
    </script>
</body>
</html>
