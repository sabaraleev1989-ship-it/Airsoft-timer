<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>scorpTIMER</title>
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="apple-mobile-web-app-title" content="scorpTIMER">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="logo3.png">
    <style>
        :root {
            --color-team-a: #e63946;
            --color-team-b: #0066ff;
            --color-team-c: #2ecc71;
            --color-team-d: #f39c12;
            --bg: #0a0a10;
            --surface: #1a1a26;
            --text: #ffffff;
            --gold: #f4a261;
        }
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
        }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            touch-action: manipulation;
            display: flex; flex-direction: column;
        }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; padding: 6px 10px; background: var(--surface);
            border-bottom: 2px solid rgba(255,255,255,0.08);
            flex-shrink: 0; z-index: 10; flex-wrap: nowrap;
        }
        .game-timer-box {
            display: flex; align-items: center; gap: 6px;
            background: #00000033; border-radius: 30px;
            padding: 4px 12px; backdrop-filter: blur(8px);
        }
        .game-timer-label {
            font-size: 0.75rem; letter-spacing: 1.5px;
            color: #aaa; font-weight: 600; text-transform: uppercase;
        }
        .game-timer-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.6rem; font-weight: 700; color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
            min-width: 72px; text-align: center;
        }
        .game-timer-display.warning {
            color: #e76f51; animation: pulse-warn 0.7s infinite;
        }
        .btn-icon {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff; font-size: 1.3rem; width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; backdrop-filter: blur(4px);
            flex-shrink: 0;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.2); }
        .btn-icon:active { transform: scale(0.92); }
        .btn-icon.active { background: var(--gold); border-color: var(--gold); color: #000; }
        .topbar-buttons {
            display: flex; gap: 6px; align-items: center;
        }

        .main-arena {
            flex: 1; display: flex; flex-direction: column; gap: 4px;
            padding: 4px; min-height: 0;
        }
        .team-panel {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            border-radius: 18px; cursor: pointer; transition: 0.2s;
            border: 3px solid rgba(255,255,255,0.25);
            position: relative; overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.6);
            min-height: 0;
        }
        .team-panel:active { transform: scale(0.97); }
        .team-panel.inactive-for-start {
            cursor: default; filter: grayscale(0.4);
        }
        .team-panel.inactive-for-start:active { transform: none; }
        .dim-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(2px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1;
        }
        .team-panel.dimmed .dim-overlay { opacity: 1; }
        .team-content {
            position: relative; z-index: 2;
            display: flex; flex-direction: column; align-items: center;
            gap: 6px; text-align: center; padding: 8px; width: 100%;
        }
        .team-name {
            font-size: clamp(1.4rem, 5vw, 2.4rem); font-weight: 800;
            letter-spacing: 2px; text-transform: uppercase; color: #ffffff;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.9), 0 0 15px rgba(0,0,0,0.8);
            white-space: nowrap;
        }
        .team-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(2.8rem, 10vw, 6rem); font-weight: 900;
            color: #ffffff;
            text-shadow: 3px 3px 12px rgba(0,0,0,0.9), 0 0 25px rgba(0,0,0,0.8);
            line-height: 1;
        }
        .team-status {
            font-size: clamp(0.9rem, 2.5vw, 1.4rem); font-weight: 700;
            letter-spacing: 1px; background: rgba(0,0,0,0.7);
            padding: 6px 18px; border-radius: 30px; color: #ffffff;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            backdrop-filter: blur(4px); white-space: nowrap;
            max-width: 95%; overflow: hidden; text-overflow: ellipsis;
        }
        .team-panel.active-holder {
            animation: activeGlow 1.2s infinite;
            border-color: rgba(255, 255, 255, 0.7);
        }
        @keyframes activeGlow {
            0%,100% { box-shadow: 0 0 30px rgba(255,255,255,0.6), inset 0 0 30px rgba(0,0,0,0.4); }
            50% { box-shadow: 0 0 60px rgba(255,255,255,0.8), inset 0 0 50px rgba(255,255,255,0.15); }
        }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px); z-index: 100;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal {
            background: var(--surface); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px; padding: 24px 20px;
            max-width: 450px; width: 90%; display: flex; flex-direction: column; gap: 16px;
        }
        .modal h2 { text-align: center; font-size: 1.3rem; }
        .setting-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; flex-wrap: wrap;
        }
        .setting-row label { font-weight: 600; font-size: 0.9rem; color: #ccc; flex: 1; }
        .setting-row input[type="number"],
        .setting-row input[type="text"],
        .setting-row select {
            background: #0f0f17; border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 8px 10px; border-radius: 14px;
            font-size: 1rem; font-weight: 700; text-align: center; width: 100px;
        }
        .setting-row select { width: 120px; }
        .setting-row input[type="text"]:read-only {
            opacity: 0.7; background: #1a1a24;
        }
        .setting-row input[type="color"] {
            width: 50px; height: 38px; border: none; background: transparent; cursor: pointer;
        }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .btn {
            padding: 10px 20px; border-radius: 30px; border: none;
            font-weight: 700; font-size: 0.9rem; letter-spacing: 1px;
            cursor: pointer; text-transform: uppercase;
            background: rgba(255,255,255,0.1); color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn.primary { background: var(--gold); color: #000; border-color: var(--gold); }
        .btn.danger { background: #e63946; border-color: #e63946; }
        .hidden { display: none; }
        @keyframes pulse-warn { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="game-timer-box">
            <span class="game-timer-label">⏱ МАТЧ</span>
            <span class="game-timer-display" id="gameTimerDisplay">10:00</span>
        </div>
        <div class="topbar-buttons">
            <button class="btn-icon" id="btnPlayPause" title="Старт / Пауза">▶</button>
            <button class="btn-icon" id="btnReset" title="Сбросить матч">↺</button>
            <button class="btn-icon" id="btnSettings" title="Настройки">⚙️</button>
            <button class="btn-icon" id="btnEndGame" title="Завершить игру (остановить сирену)" style="display:none; background:#e76f51;">🔔</button>
        </div>
    </div>

    <div class="main-arena" id="mainArena"></div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>⚙️ Настройки</h2>
            <div class="setting-row"><label>⏳ Длительность матча (мин)</label><input type="number" id="inputMatchMin" value="10" min="1" max="120"></div>
            <div class="setting-row"><label>👥 Количество команд</label><select id="inputTeamCount"><option value="2">2 команды</option><option value="3">3 команды</option><option value="4">4 команды</option></select></div>
            <div id="teamSettings">
                <div class="setting-row"><label>🔴 Название команды A</label><input type="text" id="inputNameA" value="КРАСНЫЕ" readonly></div>
                <div class="setting-row"><label>🎨 Цвет команды A</label><input type="color" id="inputColorA" value="#e63946"></div>
                <div class="setting-row"><label>🔵 Название команды B</label><input type="text" id="inputNameB" value="СИНИЕ" readonly></div>
                <div class="setting-row"><label>🎨 Цвет команды B</label><input type="color" id="inputColorB" value="#0066ff"></div>
                <div id="teamCPanel" class="hidden">
                    <div class="setting-row"><label>🟢 Название команды C</label><input type="text" id="inputNameC" value="ЗЕЛЁНЫЕ" readonly></div>
                    <div class="setting-row"><label>🎨 Цвет команды C</label><input type="color" id="inputColorC" value="#2ecc71"></div>
                </div>
                <div id="teamDPanel" class="hidden">
                    <div class="setting-row"><label>🟠 Название команды D</label><input type="text" id="inputNameD" value="ОРАНЖЕВЫЕ" readonly></div>
                    <div class="setting-row"><label>🎨 Цвет команды D</label><input type="color" id="inputColorD" value="#f39c12"></div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn primary" id="btnSaveSettings">💾 Сохранить</button>
                <button class="btn danger" id="btnCloseSettings">✖ Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').then(function() {}).catch(function() {});
            });
        }

        (function() {
            var state = {
                matchDuration: 600, timeLeft: 600, matchActive: false, ended: false, currentHolder: null,
                times: { A: 0, B: 0, C: 0, D: 0 }, teamCount: 2,
                teamNames: { A: 'КРАСНЫЕ', B: 'СИНИЕ', C: 'ЗЕЛЁНЫЕ', D: 'ОРАНЖЕВЫЕ' },
                teamColors: { A: '#e63946', B: '#0066ff', C: '#2ecc71', D: '#f39c12' },
                lastTick: null, tickInterval: null, audioCtx: null, buffers: {}, activeSirenNode: null,
                audioLoaded: false, warningPlayed: false, warning1minPlayed: false, startSoundPlayed: false
            };

            var mainArena = document.getElementById('mainArena');
            var gameTimerDisplay = document.getElementById('gameTimerDisplay');
            var btnPlayPause = document.getElementById('btnPlayPause');
            var btnReset = document.getElementById('btnReset');
            var btnSettings = document.getElementById('btnSettings');
            var btnEndGame = document.getElementById('btnEndGame');
            var modalOverlay = document.getElementById('modalOverlay');
            var inputMatchMin = document.getElementById('inputMatchMin');
            var inputTeamCount = document.getElementById('inputTeamCount');
            var inputNameA = document.getElementById('inputNameA');
            var inputColorA = document.getElementById('inputColorA');
            var inputNameB = document.getElementById('inputNameB');
            var inputColorB = document.getElementById('inputColorB');
            var inputNameC = document.getElementById('inputNameC');
            var inputColorC = document.getElementById('inputColorC');
            var inputNameD = document.getElementById('inputNameD');
            var inputColorD = document.getElementById('inputColorD');
            var teamCPanel = document.getElementById('teamCPanel');
            var teamDPanel = document.getElementById('teamDPanel');
            var btnSaveSettings = document.getElementById('btnSaveSettings');
            var btnCloseSettings = document.getElementById('btnCloseSettings');
            var panels = {};

            function getAudioContext() {
                if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
                return state.audioCtx;
            }

            function loadAudioFile(url, callback) {
                fetch(url).then(function(r) { return r.ok ? r.arrayBuffer() : null; })
                .then(function(buf) { return buf ? getAudioContext().decodeAudioData(buf) : null; })
                .then(function(dec) { if (dec && callback) callback(url, dec); });
            }

            function preloadAudioFiles() {
                if (state.audioLoaded) return;
                var files = ['siren.mp3','siren1.mp3','siren2.mp3','siren3.mp3','kras.mp3','sinie.mp3','zelen.mp3','zeltie.mp3','bel.mp3'];
                files.forEach(function(f) {
                    loadAudioFile(f, function(name, buf) { state.buffers[name] = buf; });
                });
                setTimeout(function() { state.audioLoaded = true; }, 3000);
            }

            function getSoundForColor(hex) {
                hex = hex.replace('#','').toLowerCase();
                var r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
                if ((r > 200 && g > 180 && b < 100) || (r > 200 && g > 80 && g < 180 && b < 80)) return 'zeltie.mp3';
                if (r > 200 && g > 200 && b > 200) return 'bel.mp3';
                if (r > g && r > b) return 'kras.mp3';
                if (b > r && b > g) return 'sinie.mp3';
                if (g > r && g > b) return 'zelen.mp3';
                if (r > 180 && b > 150) return 'kras.mp3';
                if (g > 180 && b > 150) return 'sinie.mp3';
                if (r > 120 && b > 180) return 'sinie.mp3';
                return 'kras.mp3';
            }

            function playBuffer(buf, loop) {
                if (!buf) return;
                var ctx = getAudioContext(), src = ctx.createBufferSource();
                src.buffer = buf; src.loop = !!loop; src.connect(ctx.destination); src.start(0);
                return src;
            }

            function playCaptureSound(color) {
                if (!state.audioLoaded) return;
                var file = getSoundForColor(color);
                if (state.buffers[file]) playBuffer(state.buffers[file], false);
            }

            function startSiren() { stopSiren(); if (state.buffers['siren.mp3']) state.activeSirenNode = playBuffer(state.buffers['siren.mp3'], true); }
            function stopSiren() { if (state.activeSirenNode) { try { state.activeSirenNode.stop(); } catch(e) {} state.activeSirenNode = null; } }

            function playTick() {
                if (!state.audioLoaded) return;
                try {
                    var ctx = getAudioContext(), o = ctx.createOscillator(), g = ctx.createGain();
                    o.type = 'square'; o.frequency.setValueAtTime(1200, ctx.currentTime);
                    g.gain.setValueAtTime(0.7, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.08);
                    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.1);
                } catch(e) {}
            }

            var tickTimer = null;
            function startTickSound() {
                stopTickSound();
                if (state.matchActive && state.currentHolder && state.audioLoaded) {
                    playTick();
                    tickTimer = setInterval(function() { if (state.matchActive && state.currentHolder) playTick(); else stopTickSound(); }, 1000);
                }
            }
            function stopTickSound() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }

            function formatTime(sec) {
                var m = Math.floor(sec/60), s = Math.floor(sec%60);
                return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
            }

            function getWinningTeam() {
                var max = null, maxT = -1;
                ['A','B','C','D'].forEach(function(t) { if (state.times[t] > maxT) { maxT = state.times[t]; max = t; } });
                return max;
            }

            function updateUI() {
                gameTimerDisplay.textContent = formatTime(state.timeLeft);
                gameTimerDisplay.classList.toggle('warning', state.matchActive && state.timeLeft<=60 && state.timeLeft>0);
                var teams = ['A','B','C','D'].slice(0, state.teamCount);
                teams.forEach(function(t) {
                    var p = panels[t]; if (!p) return;
                    p.querySelector('.team-name').textContent = state.teamNames[t];
                    p.style.backgroundColor = state.teamColors[t];
                    p.querySelector('.team-time').textContent = formatTime(state.times[t]);
                    var txt = 'ОЖИДАЙТЕ СТАРТА';
                    if (state.ended) { var w = getWinningTeam(); txt = (t===w&&w)?'🏆 ПОБЕДИТЕЛЬ':''; }
                    else if (state.matchActive) txt = state.currentHolder===t ? '⚡ УДЕРЖАНИЕ' : 'НАЖМИТЕ ДЛЯ ЗАХВАТА';
                    p.querySelector('.team-status').textContent = txt;
                    p.classList.remove('active-holder','dimmed','inactive-for-start');
                    if (!state.matchActive && !state.ended) p.classList.add('inactive-for-start');
                    if (state.matchActive && !state.ended) {
                        if (state.currentHolder===t) p.classList.add('active-holder');
                        else if (state.currentHolder) p.classList.add('dimmed');
                    }
                });
                btnEndGame.style.display = state.ended ? 'flex' : 'none';
                btnPlayPause.textContent = state.matchActive ? '⏸' : '▶';
                if (state.matchActive) btnPlayPause.classList.add('active'); else btnPlayPause.classList.remove('active');
            }

            function capture(team) {
                if (state.ended || !state.matchActive || state.currentHolder===team) return;
                state.currentHolder = team;
                playCaptureSound(state.teamColors[team]);
                startTickSound();
                updateUI();
            }

            function proceedStartMatch() {
                state.matchActive = true;
                state.warningPlayed = false;
                state.warning1minPlayed = false;
                state.startSoundPlayed = false;
                state.lastTick = Date.now();
                if (!state.tickInterval) state.tickInterval = setInterval(gameTick, 100);
                updateUI();
                if (state.currentHolder) startTickSound();
            }

            function startMatch() {
                if (state.ended) resetMatch();
                if (!state.audioLoaded) { preloadAudioFiles(); setTimeout(proceedStartMatch, 500); }
                else proceedStartMatch();
            }

            function pauseMatch() { state.matchActive = false; stopTickSound(); updateUI(); }
            function toggleMatch() { if (state.ended) return; state.matchActive ? pauseMatch() : startMatch(); }

            function resetMatch() {
                pauseMatch();
                state.timeLeft = state.matchDuration;
                state.ended = false; state.currentHolder = null;
                state.times = { A:0,B:0,C:0,D:0 };
                state.warningPlayed = false; state.warning1minPlayed = false; state.startSoundPlayed = false;
                stopSiren();
                if (state.tickInterval) { clearInterval(state.tickInterval); state.tickInterval = null; }
                updateUI(); btnEndGame.style.display = 'none';
            }

            function endMatchByTimer() {
                state.matchActive = false; state.ended = true; state.currentHolder = null;
                stopTickSound(); startSiren(); updateUI();
            }
            function finishGame() { stopSiren(); state.ended = false; state.currentHolder = null; updateUI(); }

            function gameTick() {
                var now = Date.now();
                if (!state.matchActive || !state.lastTick) { state.lastTick = now; return; }
                var d = (now - state.lastTick) / 1000;
                if (d <= 0) return;
                var prev = state.timeLeft;
                state.timeLeft -= d;

                // Звук старта (10:00) — проигрывается один раз в начале
                if (!state.startSoundPlayed && state.timeLeft > 0 && state.buffers['siren3.mp3']) {
                    state.startSoundPlayed = true;
                    playBuffer(state.buffers['siren3.mp3'], false);
                }

                // Предупреждение за 5 минут
                if (prev > 300 && state.timeLeft <= 300 && !state.warningPlayed && state.timeLeft > 0) {
                    state.warningPlayed = true;
                    if (state.buffers['siren1.mp3']) playBuffer(state.buffers['siren1.mp3'], false);
                }
                // Предупреждение за 1 минуту
                if (prev > 60 && state.timeLeft <= 60 && !state.warning1minPlayed && state.timeLeft > 0) {
                    state.warning1minPlayed = true;
                    if (state.buffers['siren2.mp3']) playBuffer(state.buffers['siren2.mp3'], false);
                }

                if (state.timeLeft <= 0) { state.timeLeft = 0; endMatchByTimer(); return; }
                if (state.currentHolder) state.times[state.currentHolder] += d;
                state.lastTick = now;
                updateUI();
            }

            function renderPanels() {
                mainArena.innerHTML = ''; panels = {};
                for (var i = 0; i < state.teamCount; i++) {
                    var team = String.fromCharCode(65+i);
                    var panel = document.createElement('div');
                    panel.className = 'team-panel inactive-for-start';
                    panel.style.backgroundColor = state.teamColors[team];
                    panel.innerHTML = '<div class="dim-overlay"></div><div class="team-content"><div class="team-name">'+state.teamNames[team]+'</div><div class="team-time" id="time'+team+'">00:00</div><div class="team-status" id="status'+team+'">ОЖИДАЙТЕ СТАРТА</div></div>';
                    panel.addEventListener('click', (function(t) { return function(e) { e.preventDefault(); capture(t); }; })(team));
                    panel.addEventListener('touchend', (function(t) { return function(e) { e.preventDefault(); capture(t); }; })(team));
                    mainArena.appendChild(panel); panels[team] = panel;
                }
            }

            function getColorName(hex) {
                hex = hex.replace('#','').toLowerCase();
                var r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
                if (r > 200 && g > 180 && b < 100) return 'Жёлтые';
                if (r > 200 && g > 80 && g < 180 && b < 80) return 'Оранжевые';
                if (r > 200 && g > 200 && b > 200) return 'Белые';
                if (r < 50 && g < 50 && b < 50) return 'Чёрные';
                if (r > g && r > b && r > 100) return 'Красные';
                if (g > r && g > b && g > 100) return 'Зелёные';
                if (b > r && b > g && b > 100) return 'Синие';
                if (r > 180 && b > 150) return 'Розовые';
                if (g > 180 && b > 150) return 'Голубые';
                if (r > 120 && b > 180) return 'Фиолетовые';
                return 'Команда';
            }

            inputColorA.addEventListener('input', function() { if (inputNameA.readOnly) inputNameA.value = getColorName(inputColorA.value); });
            inputColorB.addEventListener('input', function() { if (inputNameB.readOnly) inputNameB.value = getColorName(inputColorB.value); });
            inputColorC.addEventListener('input', function() { if (inputNameC.readOnly) inputNameC.value = getColorName(inputColorC.value); });
            inputColorD.addEventListener('input', function() { if (inputNameD.readOnly) inputNameD.value = getColorName(inputColorD.value); });

            inputTeamCount.addEventListener('change', function() {
                var v = parseInt(inputTeamCount.value, 10);
                teamCPanel.classList.toggle('hidden', v < 3);
                teamDPanel.classList.toggle('hidden', v < 4);
            });

            function openSettings() {
                inputMatchMin.value = Math.round(state.matchDuration/60);
                inputTeamCount.value = state.teamCount;
                inputNameA.value = state.teamNames.A; inputColorA.value = state.teamColors.A;
                inputNameB.value = state.teamNames.B; inputColorB.value = state.teamColors.B;
                inputNameC.value = state.teamNames.C; inputColorC.value = state.teamColors.C;
                inputNameD.value = state.teamNames.D; inputColorD.value = state.teamColors.D;
                teamCPanel.classList.toggle('hidden', state.teamCount < 3);
                teamDPanel.classList.toggle('hidden', state.teamCount < 4);
                modalOverlay.classList.add('open');
            }

            function closeSettings() { modalOverlay.classList.remove('open'); }

            function saveSettings() {
                var mins = parseInt(inputMatchMin.value, 10); if (isNaN(mins) || mins<1) mins = 10;
                state.matchDuration = mins * 60; state.teamCount = parseInt(inputTeamCount.value, 10);
                state.teamNames.A = inputNameA.value.trim() || 'A';
                state.teamNames.B = inputNameB.value.trim() || 'B';
                if (state.teamCount >= 3) state.teamNames.C = inputNameC.value.trim() || 'C';
                if (state.teamCount >= 4) state.teamNames.D = inputNameD.value.trim() || 'D';
                state.teamColors.A = inputColorA.value; state.teamColors.B = inputColorB.value;
                if (state.teamCount >= 3) state.teamColors.C = inputColorC.value;
                if (state.teamCount >= 4) state.teamColors.D = inputColorD.value;
                localStorage.setItem('appSettings', JSON.stringify({
                    teamCount: state.teamCount, names: state.teamNames, colors: state.teamColors, matchDuration: state.matchDuration
                }));
                renderPanels(); resetMatch(); closeSettings(); updateUI();
            }

            function loadSettings() {
                var saved = localStorage.getItem('appSettings');
                if (saved) {
                    try {
                        var d = JSON.parse(saved);
                        state.teamCount = d.teamCount || 2; state.teamNames = d.names || state.teamNames;
                        state.teamColors = d.colors || state.teamColors; state.matchDuration = d.matchDuration || 600;
                    } catch(e) {}
                }
                state.timeLeft = state.matchDuration;
            }

            btnPlayPause.addEventListener('click', toggleMatch);
            btnReset.addEventListener('click', resetMatch);
            btnSettings.addEventListener('click', openSettings);
            btnEndGame.addEventListener('click', finishGame);
            btnSaveSettings.addEventListener('click', saveSettings);
            btnCloseSettings.addEventListener('click', closeSettings);
            modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) closeSettings(); });

            window.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
                if (e.key === 'a') { capture('A'); e.preventDefault(); }
                if (e.key === 'b') { capture('B'); e.preventDefault(); }
                if (e.key === 'c' && state.teamCount >= 3) { capture('C'); e.preventDefault(); }
                if (e.key === 'd' && state.teamCount >= 4) { capture('D'); e.preventDefault(); }
                if (e.key === ' ') { toggleMatch(); e.preventDefault(); }
                if (e.key === 'r') { resetMatch(); e.preventDefault(); }
                if (e.key === 's') { openSettings(); e.preventDefault(); }
                if (e.key === 'Escape') { closeSettings(); }
            });

            loadSettings();
            renderPanels();
            updateUI();
            preloadAudioFiles();
        })();
    </script>
</body>
</html>
