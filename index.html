<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Захват точки · Страйкбол</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --color-team-a: #e63946;
            --color-team-b: #1d3557;
            --bg: #0a0a10;
            --surface: #1a1a26;
            --text: #ffffff;
            --gold: #f4a261;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
        }

        /* Предупреждение при портретной ориентации (если авто-поворот не сработал) */
        .rotate-hint {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            padding: 20px;
            pointer-events: none;
            color: #fff;
            display: none;
        }
        @media (orientation: portrait) {
            .rotate-hint {
                display: flex;
            }
            .topbar, .main-arena {
                display: none;
            }
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 10px;
            background: var(--surface);
            border-bottom: 2px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
            z-index: 10;
            flex-wrap: wrap;
        }
        .game-timer-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #00000033;
            border-radius: 30px;
            padding: 4px 14px;
            backdrop-filter: blur(8px);
        }
        .game-timer-label {
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            color: #aaa;
            font-weight: 600;
            text-transform: uppercase;
        }
        .game-timer-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
            min-width: 75px;
            text-align: center;
        }
        .game-timer-display.warning {
            color: #e76f51;
            animation: pulse-warn 0.7s infinite;
        }
        .btn-icon {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            font-size: 1.2rem;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .btn-icon:hover { background: rgba(255,255,255,0.2); }
        .btn-icon:active { transform: scale(0.92); }
        .btn-icon.active { background: var(--gold); border-color: var(--gold); color: #000; }
        .btn-icon.landscape-active { background: #2a9d8f; border-color: #2a9d8f; }

        .main-arena {
            flex: 1;
            display: flex;
            flex-direction: row;
            gap: 6px;
            padding: 8px;
            min-height: 0;
        }

        .team-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
            border: 3px solid rgba(255,255,255,0.25);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
            min-width: 0;
        }
        .team-panel:active { transform: scale(0.97); }

        .dim-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1;
        }
        .team-panel.dimmed .dim-overlay { opacity: 1; }

        .team-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
            padding: 8px;
            width: 100%;
        }
        .team-name {
            font-size: clamp(1rem, 3vw, 1.8rem);
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            white-space: nowrap;
        }
        .team-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(2.2rem, 7vw, 4.5rem);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
            line-height: 1;
        }
        .team-status {
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-weight: 700;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.6);
            padding: 4px 14px;
            border-radius: 20px;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            white-space: nowrap;
            max-width: 95%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .team-panel.active-holder {
            animation: activeGlow 1.2s infinite;
            border-color: rgba(255,255,255,0.7);
        }
        @keyframes activeGlow {
            0%,100% { box-shadow: 0 0 40px rgba(255,255,255,0.6), inset 0 0 40px rgba(0,0,0,0.4); }
            50% { box-shadow: 0 0 70px rgba(255,255,255,0.8), inset 0 0 60px rgba(255,255,255,0.15); }
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 24px 20px;
            max-width: 400px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal h2 { text-align: center; font-size: 1.3rem; }
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        .setting-row label { font-weight: 600; font-size: 0.9rem; color: #ccc; flex: 1; }
        .setting-row input[type="number"],
        .setting-row input[type="text"] {
            background: #0f0f17;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 10px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            width: 100px;
        }
        .setting-row input[type="text"]:read-only {
            opacity: 0.7;
            background: #1a1a24;
        }
        .setting-row input[type="color"] {
            width: 50px;
            height: 38px;
            border: none;
            background: transparent;
            cursor: pointer;
        }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .btn {
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn.primary { background: var(--gold); color: #000; border-color: var(--gold); }
        .btn.danger { background: #e63946; border-color: #e63946; }

        @keyframes pulse-warn { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    </style>
</head>
<body>
    <!-- Подсказка при портретной ориентации (если авто-поворот не сработал) -->
    <div class="rotate-hint" id="rotateHint">📱 Пожалуйста, поверните устройство<br>в альбомный режим</div>

    <div class="topbar">
        <div class="game-timer-box">
            <span class="game-timer-label">⏱ МАТЧ</span>
            <span class="game-timer-display" id="gameTimerDisplay">10:00</span>
        </div>
        <button class="btn-icon" id="btnPlayPause" title="Старт / Пауза">▶</button>
        <button class="btn-icon" id="btnReset" title="Сбросить матч">↺</button>
        <button class="btn-icon" id="btnLandscape" title="Заблокировать альбомную ориентацию">🔄</button>
        <button class="btn-icon" id="btnSettings" title="Настройки">⚙️</button>
        <button class="btn-icon" id="btnEndGame" title="Завершить игру (остановить сирену)" style="display:none; background:#e76f51;">🔔</button>
    </div>

    <div class="main-arena">
        <div class="team-panel" id="panelA">
            <div class="dim-overlay"></div>
            <div class="team-content">
                <div class="team-name" id="nameA">КРАСНЫЕ</div>
                <div class="team-time" id="timeA">00:00</div>
                <div class="team-status" id="statusA">НАЖМИТЕ ДЛЯ ЗАХВАТА</div>
            </div>
        </div>
        <div class="team-panel" id="panelB">
            <div class="dim-overlay"></div>
            <div class="team-content">
                <div class="team-name" id="nameB">СИНИЕ</div>
                <div class="team-time" id="timeB">00:00</div>
                <div class="team-status" id="statusB">НАЖМИТЕ ДЛЯ ЗАХВАТА</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>⚙️ Настройки</h2>
            <div class="setting-row">
                <label>⏳ Длительность матча (мин)</label>
                <input type="number" id="inputMatchMin" value="10" min="1" max="120">
            </div>
            <div class="setting-row">
                <label>🔴 Название команды A</label>
                <input type="text" id="inputNameA" value="КРАСНЫЕ" readonly>
            </div>
            <div class="setting-row">
                <label>🎨 Цвет кнопки A</label>
                <input type="color" id="inputColorA" value="#e63946">
            </div>
            <div class="setting-row">
                <label>🔵 Название команды B</label>
                <input type="text" id="inputNameB" value="СИНИЕ" readonly>
            </div>
            <div class="setting-row">
                <label>🎨 Цвет кнопки B</label>
                <input type="color" id="inputColorB" value="#1d3557">
            </div>
            <div class="modal-actions">
                <button class="btn primary" id="btnSaveSettings">💾 Сохранить</button>
                <button class="btn danger" id="btnCloseSettings">✖ Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // DOM
            const gameTimerDisplay = document.getElementById('gameTimerDisplay');
            const panelA = document.getElementById('panelA');
            const panelB = document.getElementById('panelB');
            const timeAEl = document.getElementById('timeA');
            const timeBEl = document.getElementById('timeB');
            const nameAEl = document.getElementById('nameA');
            const nameBEl = document.getElementById('nameB');
            const statusAEl = document.getElementById('statusA');
            const statusBEl = document.getElementById('statusB');
            const btnPlayPause = document.getElementById('btnPlayPause');
            const btnReset = document.getElementById('btnReset');
            const btnLandscape = document.getElementById('btnLandscape');
            const btnSettings = document.getElementById('btnSettings');
            const btnEndGame = document.getElementById('btnEndGame');
            const modalOverlay = document.getElementById('modalOverlay');
            const inputMatchMin = document.getElementById('inputMatchMin');
            const inputNameA = document.getElementById('inputNameA');
            const inputColorA = document.getElementById('inputColorA');
            const inputNameB = document.getElementById('inputNameB');
            const inputColorB = document.getElementById('inputColorB');
            const btnSaveSettings = document.getElementById('btnSaveSettings');
            const btnCloseSettings = document.getElementById('btnCloseSettings');
            const rotateHint = document.getElementById('rotateHint');

            // Состояние
            const state = {
                matchDuration: 10 * 60,
                timeLeft: 10 * 60,
                active: false,
                ended: false,
                currentHolder: null,
                timeA: 0,
                timeB: 0,
                lastTick: null,
                tickInterval: null,
                sirenInterval: null,
                sirenOsc: null,
                sirenGain: null,
                audioCtx: null,
                nameA: 'КРАСНЫЕ',
                nameB: 'СИНИЕ',
                colorA: '#e63946',
                colorB: '#1d3557',
                landscapeLocked: false,
            };

            // --- ЗВУК ---
            function getAudioContext() {
                if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
                return state.audioCtx;
            }
            function playTick() {
                try {
                    const ctx = getAudioContext();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(1200, ctx.currentTime);
                    gain.gain.setValueAtTime(1.0, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } catch (e) {}
            }
            function stopSiren() {
                if (state.sirenInterval) { clearInterval(state.sirenInterval); state.sirenInterval = null; }
                if (state.sirenOsc) { try { state.sirenOsc.stop(); } catch(e) {} state.sirenOsc = null; }
                if (state.sirenGain) { state.sirenGain.disconnect(); state.sirenGain = null; }
            }
            function startSiren() {
                stopSiren();
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                gain.gain.setValueAtTime(0.9, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                state.sirenOsc = osc;
                state.sirenGain = gain;
                let freqHigh = true;
                state.sirenInterval = setInterval(() => {
                    if (!state.sirenOsc) return;
                    freqHigh = !freqHigh;
                    state.sirenOsc.frequency.setValueAtTime(freqHigh ? 900 : 600, getAudioContext().currentTime);
                }, 400);
            }

            let tickTimer = null;
            function startTickSound() {
                stopTickSound();
                if (state.active && state.currentHolder !== null) {
                    playTick();
                    tickTimer = setInterval(() => {
                        if (state.active && state.currentHolder !== null) playTick();
                        else stopTickSound();
                    }, 1000);
                }
            }
            function stopTickSound() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }

            function formatTime(sec) {
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }

            function getColorName(hex) {
                const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
                const colors = [
                    {name:'Красные', r:220,g:50,b:50}, {name:'Синие', r:30,g:60,b:130},
                    {name:'Зелёные', r:40,g:140,b:60}, {name:'Жёлтые', r:240,g:210,b:50},
                    {name:'Оранжевые', r:240,g:130,b:30}, {name:'Фиолетовые', r:130,g:50,b:180},
                    {name:'Белые', r:230,g:230,b:230}, {name:'Чёрные', r:20,g:20,b:20},
                    {name:'Розовые', r:240,g:120,b:160}, {name:'Голубые', r:70,g:180,b:210}
                ];
                let min = Infinity, name = 'Команда';
                for (const c of colors) {
                    const d = (r-c.r)**2 + (g-c.g)**2 + (b-c.b)**2;
                    if (d < min) { min = d; name = c.name; }
                }
                return name;
            }

            function updateUI() {
                gameTimerDisplay.textContent = formatTime(state.timeLeft);
                gameTimerDisplay.classList.toggle('warning', state.active && state.timeLeft <= 60 && state.timeLeft > 0);
                timeAEl.textContent = formatTime(state.timeA);
                timeBEl.textContent = formatTime(state.timeB);
                const holder = state.currentHolder;
                const isEnded = state.ended;
                statusAEl.textContent = isEnded ? (state.timeA > state.timeB ? '🏆 ПОБЕДИТЕЛЬ' : '') : (holder === 'A' ? '⚡ УДЕРЖАНИЕ' : 'НАЖМИТЕ ДЛЯ ЗАХВАТА');
                statusBEl.textContent = isEnded ? (state.timeB > state.timeA ? '🏆 ПОБЕДИТЕЛЬ' : '') : (holder === 'B' ? '⚡ УДЕРЖАНИЕ' : 'НАЖМИТЕ ДЛЯ ЗАХВАТА');
                btnPlayPause.textContent = state.active ? '⏸' : '▶';
                btnPlayPause.classList.toggle('active', state.active);
                btnEndGame.style.display = state.ended ? 'flex' : 'none';
                panelA.classList.remove('active-holder', 'dimmed');
                panelB.classList.remove('active-holder', 'dimmed');
                if (!isEnded && holder === 'A') {
                    panelA.classList.add('active-holder');
                    panelB.classList.add('dimmed');
                } else if (!isEnded && holder === 'B') {
                    panelB.classList.add('active-holder');
                    panelA.classList.add('dimmed');
                }
                btnLandscape.classList.toggle('landscape-active', state.landscapeLocked);
            }

            function applySettingsToUI() {
                document.documentElement.style.setProperty('--color-team-a', state.colorA);
                document.documentElement.style.setProperty('--color-team-b', state.colorB);
                panelA.style.backgroundColor = state.colorA;
                panelB.style.backgroundColor = state.colorB;
                nameAEl.textContent = state.nameA;
                nameBEl.textContent = state.nameB;
                updateUI();
            }

            function capture(team) {
                if (state.ended) return;
                if (!state.active) startMatch();
                if (state.currentHolder === team) return;
                state.currentHolder = team;
                startTickSound();
                try {
                    const ctx = getAudioContext();
                    const o = ctx.createOscillator();
                    const g = ctx.createGain();
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(team==='A'?800:600, ctx.currentTime);
                    g.gain.setValueAtTime(0.6, ctx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.2);
                    o.connect(g); g.connect(ctx.destination);
                    o.start(); o.stop(ctx.currentTime+0.22);
                } catch(e) {}
                updateUI();
            }

            function startMatch() {
                if (state.ended) resetMatch();
                state.active = true;
                state.lastTick = Date.now();
                if (!state.tickInterval) state.tickInterval = setInterval(gameTick, 100);
                updateUI();
                if (state.currentHolder) startTickSound();
            }
            function pauseMatch() { state.active = false; state.lastTick = null; stopTickSound(); updateUI(); }
            function toggleMatch() { if (!state.ended) state.active ? pauseMatch() : startMatch(); }
            function resetMatch() {
                pauseMatch();
                state.timeLeft = state.matchDuration;
                state.ended = false;
                state.currentHolder = null;
                state.timeA = 0; state.timeB = 0;
                stopSiren(); stopTickSound();
                if (state.tickInterval) { clearInterval(state.tickInterval); state.tickInterval = null; }
                updateUI();
                btnEndGame.style.display = 'none';
            }
            function endMatchByTimer() {
                state.active = false; state.ended = true; state.currentHolder = null;
                stopTickSound(); startSiren(); updateUI();
                btnEndGame.style.display = 'flex';
            }
            function finishGame() { stopSiren(); state.ended = false; state.currentHolder = null; updateUI(); btnEndGame.style.display = 'none'; }

            function gameTick() {
                const now = Date.now();
                if (!state.active || !state.lastTick) { state.lastTick = now; return; }
                const delta = (now - state.lastTick) / 1000;
                if (delta <= 0) return;
                state.timeLeft -= delta;
                if (state.timeLeft <= 0) {
                    state.timeLeft = 0; state.lastTick = null;
                    endMatchByTimer(); return;
                }
                if (state.currentHolder === 'A') state.timeA += delta;
                else if (state.currentHolder === 'B') state.timeB += delta;
                state.lastTick = now;
                updateUI();
            }

            // Настройки
            function openSettings() {
                inputMatchMin.value = Math.round(state.matchDuration / 60);
                inputNameA.value = state.nameA;
                inputColorA.value = state.colorA;
                inputNameB.value = state.nameB;
                inputColorB.value = state.colorB;
                modalOverlay.classList.add('open');
            }
            function closeSettings() { modalOverlay.classList.remove('open'); }
            function saveSettings() {
                let mins = parseInt(inputMatchMin.value, 10);
                if (isNaN(mins) || mins<1) mins=10;
                state.matchDuration = mins*60;
                state.nameA = inputNameA.value.trim() || 'КОМАНДА A';
                state.nameB = inputNameB.value.trim() || 'КОМАНДА B';
                state.colorA = inputColorA.value;
                state.colorB = inputColorB.value;
                applySettingsToUI();
                resetMatch();
                closeSettings();
            }

            inputColorA.addEventListener('input', () => { if (inputNameA.readOnly) inputNameA.value = getColorName(inputColorA.value); });
            inputColorB.addEventListener('input', () => { if (inputNameB.readOnly) inputNameB.value = getColorName(inputColorB.value); });

            async function lockLandscape() {
                try {
                    // Пытаемся войти в полноэкранный режим (необходимо для блокировки ориентации)
                    if (document.fullscreenEnabled && !document.fullscreenElement) {
                        await document.documentElement.requestFullscreen();
                    }
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape');
                        state.landscapeLocked = true;
                        updateUI();
                        return;
                    }
                } catch (e) {}
                // Если не получилось – показываем подсказку повернуть устройство
                rotateHint.style.display = 'flex';
            }

            function toggleLandscapeLock() {
                if (state.landscapeLocked) {
                    if (screen.orientation && screen.orientation.unlock) {
                        screen.orientation.unlock();
                        state.landscapeLocked = false;
                        updateUI();
                        rotateHint.style.display = 'none';
                    }
                } else {
                    lockLandscape().then(() => {
                        if (state.landscapeLocked) rotateHint.style.display = 'none';
                    });
                }
            }

            // При загрузке сразу вызываем блокировку
            window.addEventListener('load', () => {
                lockLandscape();
            });

            // События
            panelA.addEventListener('click', (e) => { e.preventDefault(); capture('A'); });
            panelA.addEventListener('touchend', (e) => { e.preventDefault(); capture('A'); });
            panelB.addEventListener('click', (e) => { e.preventDefault(); capture('B'); });
            panelB.addEventListener('touchend', (e) => { e.preventDefault(); capture('B'); });
            btnPlayPause.addEventListener('click', toggleMatch);
            btnReset.addEventListener('click', resetMatch);
            btnLandscape.addEventListener('click', toggleLandscapeLock);
            btnSettings.addEventListener('click', openSettings);
            btnEndGame.addEventListener('click', finishGame);
            btnSaveSettings.addEventListener('click', saveSettings);
            btnCloseSettings.addEventListener('click', closeSettings);
            modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeSettings(); });

            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                switch(e.key.toLowerCase()) {
                    case 'a': capture('A'); e.preventDefault(); break;
                    case 'b': capture('B'); e.preventDefault(); break;
                    case ' ': toggleMatch(); e.preventDefault(); break;
                    case 'r': resetMatch(); e.preventDefault(); break;
                    case 'l': toggleLandscapeLock(); e.preventDefault(); break;
                    case 's': openSettings(); e.preventDefault(); break;
                    case 'escape': closeSettings(); break;
                }
            });

            applySettingsToUI();
            resetMatch();
            inputNameA.value = getColorName(inputColorA.value);
            inputNameB.value = getColorName(inputColorB.value);
        })();
    </script>
</body>
</html>
