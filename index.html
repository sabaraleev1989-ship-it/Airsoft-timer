<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>scorpTIMER</title>
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="apple-mobile-web-app-title" content="scorpTIMER">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="logo3.png">
    <style>
        :root {
            --color-team-a: #e63946;
            --color-team-b: #0066ff;
            --color-team-c: #2ecc71;
            --bg: #0a0a10;
            --surface: #1a1a26;
            --text: #ffffff;
            --gold: #f4a261;
        }
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
        }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            touch-action: manipulation;
            display: flex; flex-direction: column;
        }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; padding: 8px 12px; background: var(--surface);
            border-bottom: 2px solid rgba(255,255,255,0.08);
            flex-shrink: 0; z-index: 10; flex-wrap: wrap;
        }
        .topbar-left {
            display: flex; align-items: center; gap: 8px;
        }
        .game-timer-box {
            display: flex; align-items: center; gap: 6px;
            background: #00000033; border-radius: 30px;
            padding: 4px 14px; backdrop-filter: blur(8px);
        }
        .game-timer-label {
            font-size: 0.8rem; letter-spacing: 1.5px;
            color: #aaa; font-weight: 600; text-transform: uppercase;
        }
        .game-timer-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8rem; font-weight: 700; color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
            min-width: 80px; text-align: center;
        }
        .game-timer-display.warning {
            color: #e76f51; animation: pulse-warn 0.7s infinite;
        }
        .trial-indicator {
            font-size: 0.75rem; opacity: 0.8; color: #ccc;
            margin-left: 10px; white-space: nowrap;
        }
        .btn-icon {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff; font-size: 1.3rem; width: 42px; height: 42px;
            border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; backdrop-filter: blur(4px);
        }
        .btn-icon:hover { background: rgba(255,255,255,0.2); }
        .btn-icon:active { transform: scale(0.92); }
        .btn-icon.active { background: var(--gold); border-color: var(--gold); color: #000; }
        .main-arena {
            flex: 1; display: flex; flex-direction: column; gap: 6px;
            padding: 8px; min-height: 0;
        }
        .team-panel {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            border-radius: 18px; cursor: pointer; transition: 0.2s;
            border: 3px solid rgba(255,255,255,0.25);
            position: relative; overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
            min-height: 0;
        }
        .team-panel:active { transform: scale(0.97); }
        .team-panel.inactive-for-start {
            cursor: default; filter: grayscale(0.4);
        }
        .team-panel.inactive-for-start:active { transform: none; }
        .dim-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(2px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1;
        }
        .team-panel.dimmed .dim-overlay { opacity: 1; }
        .team-content {
            position: relative; z-index: 2;
            display: flex; flex-direction: column; align-items: center;
            gap: 8px; text-align: center; padding: 12px; width: 100%;
        }
        .team-name {
            font-size: clamp(1.2rem, 5vw, 2.2rem); font-weight: 800;
            letter-spacing: 2px; text-transform: uppercase; color: #ffffff;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.9), 0 0 15px rgba(0,0,0,0.8);
            white-space: nowrap;
        }
        .team-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(2.5rem, 10vw, 5rem); font-weight: 900;
            color: #ffffff;
            text-shadow: 3px 3px 12px rgba(0,0,0,0.9), 0 0 25px rgba(0,0,0,0.8);
            line-height: 1;
        }
        .team-status {
            font-size: clamp(0.9rem, 2.5vw, 1.4rem); font-weight: 700;
            letter-spacing: 1px; background: rgba(0,0,0,0.7);
            padding: 6px 18px; border-radius: 30px; color: #ffffff;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            backdrop-filter: blur(4px); white-space: nowrap;
            max-width: 95%; overflow: hidden; text-overflow: ellipsis;
        }
        .team-panel.active-holder {
            animation: activeGlow 1.2s infinite;
            border-color: rgba(255, 255, 255, 0.7);
        }
        @keyframes activeGlow {
            0%,100% { box-shadow: 0 0 30px rgba(255,255,255,0.6), inset 0 0 30px rgba(0,0,0,0.4); }
            50% { box-shadow: 0 0 50px rgba(255,255,255,0.8), inset 0 0 50px rgba(255,255,255,0.15); }
        }

        /* Paywall */
        .paywall-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            backdrop-filter: blur(14px); z-index: 500;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s;
        }
        .paywall-overlay.active { opacity: 1; pointer-events: auto; }
        .paywall-card {
            background: var(--surface); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px; padding: 28px 22px;
            max-width: 400px; width: 90%; text-align: center;
            display: flex; flex-direction: column; gap: 18px;
        }
        .paywall-card h3 { font-size: 1.4rem; font-weight: 700; }
        .paywall-card p { font-size: 0.95rem; opacity: 0.85; line-height: 1.4; }
        .device-id-box {
            background: #0f0f17; border: 1px solid rgba(255,255,255,0.3);
            border-radius: 12px; padding: 10px; word-break: break-all;
            font-family: monospace; font-size: 0.85rem; letter-spacing: 0.5px;
            opacity: 0.9; user-select: all;
        }
        .paywall-input {
            background: #0f0f17; border: 1px solid rgba(255,255,255,0.3);
            color: #fff; padding: 12px 16px; border-radius: 16px;
            font-size: 1.1rem; text-align: center; letter-spacing: 1px;
            font-weight: 600; width: 100%; margin-top: 8px;
        }
        .paywall-input::placeholder { opacity: 0.5; }
        .paywall-buttons {
            display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
        }
        .paywall-btn {
            padding: 12px 24px; border-radius: 30px; border: none;
            font-weight: 700; font-size: 1rem; letter-spacing: 1px;
            cursor: pointer; text-transform: uppercase; transition: 0.2s;
        }
        .paywall-btn.primary {
            background: var(--gold); color: #000; border: 2px solid var(--gold);
        }
        .paywall-btn.primary:hover { box-shadow: 0 0 25px var(--gold); }
        .paywall-btn.secondary {
            background: transparent; color: #fff; border: 2px solid rgba(255,255,255,0.5);
        }
        .paywall-status { font-size: 0.9rem; min-height: 20px; color: #e76f51; }

        .trial-info-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px); z-index: 600;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .trial-info-overlay.active { opacity: 1; pointer-events: auto; }
        .trial-info-card {
            background: var(--surface); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px; padding: 24px 20px; max-width: 350px;
            width: 85%; text-align: center; display: flex; flex-direction: column; gap: 16px;
        }
        .trial-info-card h3 { font-size: 1.3rem; font-weight: 700; }
        .trial-info-card p { font-size: 0.95rem; opacity: 0.9; line-height: 1.4; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px); z-index: 100;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal {
            background: var(--surface); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px; padding: 24px 20px;
            max-width: 450px; width: 90%; display: flex; flex-direction: column; gap: 16px;
        }
        .modal h2 { text-align: center; font-size: 1.3rem; }
        .setting-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; flex-wrap: wrap;
        }
        .setting-row label { font-weight: 600; font-size: 0.9rem; color: #ccc; flex: 1; }
        .setting-row input[type="number"],
        .setting-row input[type="text"],
        .setting-row select {
            background: #0f0f17; border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 8px 10px; border-radius: 14px;
            font-size: 1rem; font-weight: 700; text-align: center; width: 100px;
        }
        .setting-row select { width: 110px; }
        .setting-row input[type="text"]:read-only {
            opacity: 0.7; background: #1a1a24;
        }
        .setting-row input[type="color"] {
            width: 50px; height: 38px; border: none; background: transparent; cursor: pointer;
        }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .btn {
            padding: 10px 20px; border-radius: 30px; border: none;
            font-weight: 700; font-size: 0.9rem; letter-spacing: 1px;
            cursor: pointer; text-transform: uppercase;
            background: rgba(255,255,255,0.1); color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn.primary { background: var(--gold); color: #000; border-color: var(--gold); }
        .btn.danger { background: #e63946; border-color: #e63946; }
        .hidden { display: none; }
        @keyframes pulse-warn { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    </style>
</head>
<body>
    <div class="trial-info-overlay" id="trialInfoOverlay">
        <div class="trial-info-card">
            <h3>🎁 Пробный период</h3>
            <p>Активирован пробный период на <strong>24 часа</strong>.<br>Далее доступ навсегда за <strong>500 ₽</strong>.</p>
            <button class="paywall-btn primary" id="btnTrialOk">Понятно</button>
        </div>
    </div>

    <div class="paywall-overlay" id="paywallOverlay">
        <div class="paywall-card">
            <h3>🔒 Пробный период истёк</h3>
            <p>Для продолжения приобретите доступ.<br>Единоразовый платёж <strong>500 ₽</strong> навсегда.</p>
            <p style="font-size:0.85rem;">Ваш идентификатор устройства:</p>
            <div class="device-id-box" id="deviceIdDisplay"></div>
            <a href="https://t.me/scorptimer_bot" target="_blank" class="paywall-btn primary" style="text-decoration:none; display:inline-block; width:100%;">💳 ОПЛАТИТЬ В TELEGRAM</a>
            <input type="text" class="paywall-input" id="activationCodeInput" placeholder="Введите код активации" maxlength="16" autocomplete="off">
            <div class="paywall-buttons">
                <button class="paywall-btn primary" id="btnActivate">🔓 Активировать</button>
                <button class="paywall-btn secondary" id="btnClosePaywall">✖ Закрыть</button>
            </div>
            <div class="paywall-status" id="paywallStatus"></div>
        </div>
    </div>

    <div class="topbar">
        <div class="topbar-left">
            <div class="game-timer-box">
                <span class="game-timer-label">⏱ МАТЧ</span>
                <span class="game-timer-display" id="gameTimerDisplay">10:00</span>
            </div>
            <span class="trial-indicator" id="trialIndicator"></span>
        </div>
        <div style="display: flex; gap: 6px;">
            <button class="btn-icon" id="btnPlayPause" title="Старт / Пауза">▶</button>
            <button class="btn-icon" id="btnReset" title="Сбросить матч">↺</button>
            <button class="btn-icon" id="btnSettings" title="Настройки">⚙️</button>
            <button class="btn-icon" id="btnEndGame" title="Завершить игру (остановить сирену)" style="display:none; background:#e76f51;">🔔</button>
        </div>
    </div>

    <div class="main-arena" id="mainArena">
        <!-- Команды добавляются динамически -->
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>⚙️ Настройки</h2>
            <div class="setting-row">
                <label>⏳ Длительность матча (мин)</label>
                <input type="number" id="inputMatchMin" value="10" min="1" max="120">
            </div>
            <div class="setting-row">
                <label>👥 Количество команд</label>
                <select id="inputTeamCount">
                    <option value="2">2 команды</option>
                    <option value="3">3 команды</option>
                </select>
            </div>
            <div id="teamSettings">
                <!-- Команда A -->
                <div class="setting-row">
                    <label>🔴 Название команды A</label>
                    <input type="text" id="inputNameA" value="КРАСНЫЕ" readonly>
                </div>
                <div class="setting-row">
                    <label>🎨 Цвет команды A</label>
                    <input type="color" id="inputColorA" value="#e63946">
                </div>
                <!-- Команда B -->
                <div class="setting-row">
                    <label>🔵 Название команды B</label>
                    <input type="text" id="inputNameB" value="СИНИЕ" readonly>
                </div>
                <div class="setting-row">
                    <label>🎨 Цвет команды B</label>
                    <input type="color" id="inputColorB" value="#0066ff">
                </div>
                <!-- Команда C (изначально скрыта) -->
                <div id="teamCPanel" class="hidden">
                    <div class="setting-row">
                        <label>🟢 Название команды C</label>
                        <input type="text" id="inputNameC" value="ЗЕЛЁНЫЕ" readonly>
                    </div>
                    <div class="setting-row">
                        <label>🎨 Цвет команды C</label>
                        <input type="color" id="inputColorC" value="#2ecc71">
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn primary" id="btnSaveSettings">💾 Сохранить</button>
                <button class="btn danger" id="btnCloseSettings">✖ Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        // ---------- МОНЕТИЗАЦИЯ (без изменений) ----------
        const SECRET_KEY = 'ScorpTim3r_Secret!2026';
        const TRIAL_DAYS = 1;
        function getDeviceId() {
            let id = localStorage.getItem('deviceId');
            if (!id) {
                id = 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 10);
                localStorage.setItem('deviceId', id);
            }
            return id;
        }
        async function hmacSha256(key, message) {
            const encoder = new TextEncoder();
            const cryptoKey = await crypto.subtle.importKey('raw', encoder.encode(key), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
            const signature = await crypto.subtle.sign('HMAC', cryptoKey, encoder.encode(message));
            return Array.from(new Uint8Array(signature)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        async function checkActivation() {
            if (localStorage.getItem('activated') === 'true') return true;
            const trialStart = localStorage.getItem('trialStart');
            if (!trialStart) { localStorage.setItem('trialStart', Date.now().toString()); return true; }
            const elapsed = Date.now() - parseInt(trialStart);
            if (elapsed < TRIAL_DAYS * 24 * 60 * 60 * 1000) return true;
            try {
                const response = await fetch('free_ids.txt');
                if (response.ok) {
                    const text = await response.text();
                    const allowedIds = text.split('\n').map(id => id.trim()).filter(id => id.length > 0);
                    if (allowedIds.includes(getDeviceId())) { localStorage.setItem('activated', 'true'); return true; }
                }
            } catch (e) { console.warn('free_ids.txt не загружен'); }
            return false;
        }
        async function activateDevice(inputCode) {
            const deviceId = getDeviceId();
            const expectedCode = (await hmacSha256(SECRET_KEY, deviceId)).substring(0, 16).toUpperCase();
            if (inputCode.trim().toUpperCase() === expectedCode) { localStorage.setItem('activated', 'true'); return true; }
            return false;
        }

        // ---------- СОСТОЯНИЕ ----------
        const state = {
            matchDuration: 10 * 60,
            timeLeft: 10 * 60,
            matchActive: false,
            ended: false,
            currentHolder: null, // 'A', 'B', 'C'
            times: { A: 0, B: 0, C: 0 },
            teamCount: 2, // 2 или 3
            teamNames: { A: 'КРАСНЫЕ', B: 'СИНИЕ', C: 'ЗЕЛЁНЫЕ' },
            teamColors: { A: '#e63946', B: '#0066ff', C: '#2ecc71' },
            lastTick: null,
            tickInterval: null,
            audioCtx: null,
            buffers: { siren: null, siren1: null, siren2: null },
            activeSirenNode: null,
            audioLoaded: false,
            warningPlayed: false,
            warning1minPlayed: false,
            prevTimeLeft: null,
        };

        // ---------- PAYWALL DOM ----------
        const paywallOverlay = document.getElementById('paywallOverlay');
        const deviceIdDisplay = document.getElementById('deviceIdDisplay');
        const activationCodeInput = document.getElementById('activationCodeInput');
        const btnActivate = document.getElementById('btnActivate');
        const btnClosePaywall = document.getElementById('btnClosePaywall');
        const paywallStatus = document.getElementById('paywallStatus');
        const trialInfoOverlay = document.getElementById('trialInfoOverlay');
        const btnTrialOk = document.getElementById('btnTrialOk');
        const trialIndicator = document.getElementById('trialIndicator');
        let appLocked = false;

        // ---------- UI элементы ----------
        const mainArena = document.getElementById('mainArena');
        const gameTimerDisplay = document.getElementById('gameTimerDisplay');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const btnReset = document.getElementById('btnReset');
        const btnSettings = document.getElementById('btnSettings');
        const btnEndGame = document.getElementById('btnEndGame');
        const modalOverlay = document.getElementById('modalOverlay');
        const inputMatchMin = document.getElementById('inputMatchMin');
        const inputTeamCount = document.getElementById('inputTeamCount');
        const inputNameA = document.getElementById('inputNameA');
        const inputColorA = document.getElementById('inputColorA');
        const inputNameB = document.getElementById('inputNameB');
        const inputColorB = document.getElementById('inputColorB');
        const inputNameC = document.getElementById('inputNameC');
        const inputColorC = document.getElementById('inputColorC');
        const teamCPanel = document.getElementById('teamCPanel');
        const btnSaveSettings = document.getElementById('btnSaveSettings');
        const btnCloseSettings = document.getElementById('btnCloseSettings');

        // Динамические панели команд
        let panels = {}; // { A: элемент, B: элемент, C: элемент }

        // ---------- ЗВУКИ (без изменений) ----------
        function getAudioContext() {
            if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
            return state.audioCtx;
        }
        async function loadAudioFile(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const arrayBuffer = await response.arrayBuffer();
            return await getAudioContext().decodeAudioData(arrayBuffer);
        }
        async function preloadAudioFiles() {
            if (state.audioLoaded) return;
            try {
                state.buffers.siren = await loadAudioFile('siren.mp3');
                state.buffers.siren1 = await loadAudioFile('siren1.mp3');
                state.buffers.siren2 = await loadAudioFile('siren2.mp3');
                state.audioLoaded = true;
            } catch (err) { console.warn('Аудио не загружены:', err); }
        }
        function playBuffer(buffer, loop = false) {
            if (!buffer) return;
            const ctx = getAudioContext();
            const source = ctx.createBufferSource();
            source.buffer = buffer; source.loop = loop;
            source.connect(ctx.destination);
            source.start(0);
            return source;
        }
        function startSiren() { stopSiren(); if (state.buffers.siren) state.activeSirenNode = playBuffer(state.buffers.siren, true); }
        function stopSiren() {
            if (state.activeSirenNode) { try { state.activeSirenNode.stop(); } catch(e) {} state.activeSirenNode.disconnect(); state.activeSirenNode = null; }
        }
        function playTick() {
            if (!state.audioLoaded) return;
            try {
                const ctx = getAudioContext(); const now = ctx.currentTime;
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(1200, now);
                gain.gain.setValueAtTime(0.7, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(now); osc.stop(now + 0.1);
            } catch (e) {}
        }
        let tickTimer = null;
        function startTickSound() {
            stopTickSound();
            if (state.matchActive && state.currentHolder !== null && state.audioLoaded) {
                playTick();
                tickTimer = setInterval(() => {
                    if (state.matchActive && state.currentHolder !== null) playTick();
                    else stopTickSound();
                }, 1000);
            }
        }
        function stopTickSound() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }
        async function unlockAndLoadAudio() {
            if (state.audioLoaded) return;
            const ctx = getAudioContext();
            const buffer = ctx.createBuffer(1, 1, 22050);
            const source = ctx.createBufferSource();
            source.buffer = buffer; source.connect(ctx.destination);
            source.start(0); source.stop(0);
            await preloadAudioFiles();
        }

        // ---------- ОТРИСОВКА ПАНЕЛЕЙ ----------
        function renderPanels() {
            mainArena.innerHTML = '';
            const teams = state.teamCount === 2 ? ['A', 'B'] : ['A', 'B', 'C'];
            teams.forEach(team => {
                const panel = document.createElement('div');
                panel.className = 'team-panel inactive-for-start';
                panel.id = 'panel' + team;
                panel.style.backgroundColor = state.teamColors[team];
                panel.innerHTML = `
                    <div class="dim-overlay"></div>
                    <div class="team-content">
                        <div class="team-name">${state.teamNames[team]}</div>
                        <div class="team-time" id="time${team}">00:00</div>
                        <div class="team-status" id="status${team}">ОЖИДАЙТЕ СТАРТА</div>
                    </div>
                `;
                // Обработчики событий
                panel.addEventListener('click', (e) => { e.preventDefault(); capture(team); });
                panel.addEventListener('touchend', (e) => { e.preventDefault(); capture(team); });
                mainArena.appendChild(panel);
                panels[team] = panel;
            });
        }

        function updatePanelsUI() {
            const teams = state.teamCount === 2 ? ['A', 'B'] : ['A', 'B', 'C'];
            teams.forEach(team => {
                const panel = panels[team];
                if (!panel) return;
                const timeEl = panel.querySelector('.team-time');
                const statusEl = panel.querySelector('.team-status');
                const nameEl = panel.querySelector('.team-name');
                nameEl.textContent = state.teamNames[team];
                panel.style.backgroundColor = state.teamColors[team];
                timeEl.textContent = formatTime(state.times[team]);

                const isEnded = state.ended;
                const gameStarted = state.matchActive;
                let statusText = '';
                if (!gameStarted && !isEnded) statusText = 'ОЖИДАЙТЕ СТАРТА';
                else if (isEnded) {
                    const maxTeam = getWinningTeam();
                    statusText = (team === maxTeam && maxTeam) ? '🏆 ПОБЕДИТЕЛЬ' : '';
                } else if (state.currentHolder === team) statusText = '⚡ УДЕРЖАНИЕ';
                else statusText = 'НАЖМИТЕ ДЛЯ ЗАХВАТА';
                statusEl.textContent = statusText;

                // Классы
                panel.classList.remove('active-holder', 'dimmed', 'inactive-for-start');
                if (!gameStarted && !isEnded) panel.classList.add('inactive-for-start');
                if (gameStarted && !isEnded) {
                    if (state.currentHolder === team) panel.classList.add('active-holder');
                    else if (state.currentHolder) panel.classList.add('dimmed');
                }
            });
            // Обновление видимости кнопки завершения
            btnEndGame.style.display = state.ended ? 'flex' : 'none';
        }

        function getWinningTeam() {
            const teams = state.teamCount === 2 ? ['A', 'B'] : ['A', 'B', 'C'];
            let maxTeam = null, maxTime = -1;
            teams.forEach(t => { if (state.times[t] > maxTime) { maxTime = state.times[t]; maxTeam = t; } });
            return maxTeam;
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
            return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        function updateTrialIndicator() {
            const activated = localStorage.getItem('activated') === 'true';
            if (activated) { trialIndicator.textContent = ''; return; }
            const trialStart = localStorage.getItem('trialStart');
            if (!trialStart) { trialIndicator.textContent = '⏳ Пробный период: 24ч'; return; }
            const now = Date.now();
            const end = parseInt(trialStart) + 24*60*60*1000;
            const remaining = end - now;
            if (remaining <= 0) trialIndicator.textContent = '🔒 Пробный период истёк';
            else {
                const hours = Math.floor(remaining / (60*60*1000));
                const mins = Math.floor((remaining % (60*60*1000)) / (60*1000));
                trialIndicator.textContent = `⏳ Осталось: ${hours}ч ${mins}м`;
            }
        }

        function updateUI() {
            gameTimerDisplay.textContent = formatTime(state.timeLeft);
            gameTimerDisplay.classList.toggle('warning', state.matchActive && state.timeLeft <= 60 && state.timeLeft > 0);
            updatePanelsUI();
            updateTrialIndicator();
            btnPlayPause.textContent = state.matchActive ? '⏸' : '▶';
            btnPlayPause.classList.toggle('active', state.matchActive);
            document.documentElement.style.setProperty('--color-team-a', state.teamColors.A);
            document.documentElement.style.setProperty('--color-team-b', state.teamColors.B);
            document.documentElement.style.setProperty('--color-team-c', state.teamColors.C);
        }

        function capture(team) {
            if (state.ended || !state.matchActive) return;
            if (state.currentHolder === team) return;
            state.currentHolder = team;
            startTickSound();
            try {
                const ctx = getAudioContext();
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.type = 'triangle';
                const freq = team === 'A' ? 800 : (team === 'B' ? 600 : 500);
                o.frequency.setValueAtTime(freq, ctx.currentTime);
                g.gain.setValueAtTime(0.6, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.2);
                o.connect(g); g.connect(ctx.destination);
                o.start(); o.stop(ctx.currentTime+0.22);
            } catch(e) {}
            updateUI();
        }

        function proceedStartMatch() {
            state.matchActive = true;
            state.warningPlayed = false; state.warning1minPlayed = false;
            state.prevTimeLeft = state.timeLeft;
            state.lastTick = Date.now();
            if (!state.tickInterval) state.tickInterval = setInterval(gameTick, 100);
            updateUI();
            if (state.currentHolder) startTickSound();
        }
        function startMatch() {
            if (appLocked) { paywallOverlay.classList.add('active'); return; }
            if (state.ended) resetMatch();
            if (!state.audioLoaded) {
                unlockAndLoadAudio().then(() => proceedStartMatch()).catch(() => proceedStartMatch());
            } else proceedStartMatch();
        }
        function pauseMatch() { state.matchActive = false; state.lastTick = null; stopTickSound(); updateUI(); }
        function toggleMatch() {
            if (appLocked) { paywallOverlay.classList.add('active'); return; }
            if (state.ended) return;
            state.matchActive ? pauseMatch() : startMatch();
        }
        function resetMatch() {
            pauseMatch();
            state.timeLeft = state.matchDuration;
            state.ended = false; state.currentHolder = null;
            state.times = { A: 0, B: 0, C: 0 };
            state.warningPlayed = false; state.warning1minPlayed = false;
            state.prevTimeLeft = state.timeLeft;
            stopSiren();
            if (state.tickInterval) { clearInterval(state.tickInterval); state.tickInterval = null; }
            updateUI();
            btnEndGame.style.display = 'none';
        }
        function endMatchByTimer() {
            state.matchActive = false; state.ended = true; state.currentHolder = null;
            stopTickSound(); startSiren();
            updateUI();
        }
        function finishGame() {
            stopSiren(); state.ended = false; state.currentHolder = null;
            updateUI();
        }
        function gameTick() {
            const now = Date.now();
            if (!state.matchActive || !state.lastTick) { state.lastTick = now; return; }
            const delta = (now - state.lastTick) / 1000;
            if (delta <= 0) return;
            const prev = state.timeLeft;
            state.timeLeft -= delta;
            if (prev > 300 && state.timeLeft <= 300 && !state.warningPlayed && state.timeLeft > 0) {
                state.warningPlayed = true;
                if (state.buffers.siren1) playBuffer(state.buffers.siren1);
            }
            if (prev > 60 && state.timeLeft <= 60 && !state.warning1minPlayed && state.timeLeft > 0) {
                state.warning1minPlayed = true;
                if (state.buffers.siren2) playBuffer(state.buffers.siren2);
            }
            if (state.timeLeft <= 0) { state.timeLeft = 0; state.lastTick = null; endMatchByTimer(); return; }
            if (state.currentHolder) state.times[state.currentHolder] += delta;
            state.lastTick = now;
            updateUI();
        }

        // ---------- НАСТРОЙКИ ----------
        function openSettings() {
            inputMatchMin.value = Math.round(state.matchDuration / 60);
            inputTeamCount.value = state.teamCount.toString();
            inputNameA.value = state.teamNames.A;
            inputColorA.value = state.teamColors.A;
            inputNameB.value = state.teamNames.B;
            inputColorB.value = state.teamColors.B;
            inputNameC.value = state.teamNames.C;
            inputColorC.value = state.teamColors.C;
            teamCPanel.classList.toggle('hidden', state.teamCount !== 3);
            modalOverlay.classList.add('open');
        }
        function closeSettings() { modalOverlay.classList.remove('open'); }
        function saveSettings() {
            let mins = parseInt(inputMatchMin.value, 10);
            if (isNaN(mins) || mins<1) mins = 10;
            state.matchDuration = mins * 60;
            state.teamCount = parseInt(inputTeamCount.value, 10);
            state.teamNames.A = inputNameA.value.trim() || 'КОМАНДА A';
            state.teamNames.B = inputNameB.value.trim() || 'КОМАНДА B';
            if (state.teamCount === 3) state.teamNames.C = inputNameC.value.trim() || 'КОМАНДА C';
            state.teamColors.A = inputColorA.value;
            state.teamColors.B = inputColorB.value;
            if (state.teamCount === 3) state.teamColors.C = inputColorC.value;

            // Сохраняем в localStorage
            localStorage.setItem('appSettings', JSON.stringify({
                teamCount: state.teamCount,
                names: state.teamNames,
                colors: state.teamColors,
                matchDuration: state.matchDuration
            }));

            renderPanels();
            resetMatch(); // сброс при изменении настроек
            closeSettings();
            updateUI();
        }
        function loadSettings() {
            const saved = localStorage.getItem('appSettings');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    state.teamCount = data.teamCount || 2;
                    state.teamNames = data.names || state.teamNames;
                    state.teamColors = data.colors || state.teamColors;
                    state.matchDuration = data.matchDuration || state.matchDuration;
                } catch(e) {}
            }
            state.timeLeft = state.matchDuration;
        }

        // При переключении количества команд показываем/скрываем поля C
        inputTeamCount.addEventListener('change', () => {
            teamCPanel.classList.toggle('hidden', inputTeamCount.value !== '3');
            // Автоматически обновляем название C при изменении цвета C, если поле только для чтения (оно всегда readonly)
        });

        // Авто-названия по цвету
        function getColorName(hex) {
            const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
            const colors = [
                {name:'Красные', r:220,g:50,b:50}, {name:'Синие', r:30,g:60,b:130},
                {name:'Зелёные', r:40,g:140,b:60}, {name:'Жёлтые', r:240,g:210,b:50},
                {name:'Оранжевые', r:240,g:130,b:30}, {name:'Фиолетовые', r:130,g:50,b:180},
                {name:'Белые', r:230,g:230,b:230}, {name:'Чёрные', r:20,g:20,b:20},
                {name:'Розовые', r:240,g:120,b:160}, {name:'Голубые', r:70,g:180,b:210}
            ];
            let min = Infinity, name = 'Команда';
            for (const c of colors) {
                const d = (r-c.r)**2 + (g-c.g)**2 + (b-c.b)**2;
                if (d < min) { min = d; name = c.name; }
            }
            return name;
        }
        inputColorA.addEventListener('input', () => { if (inputNameA.readOnly) inputNameA.value = getColorName(inputColorA.value); });
        inputColorB.addEventListener('input', () => { if (inputNameB.readOnly) inputNameB.value = getColorName(inputColorB.value); });
        inputColorC.addEventListener('input', () => { if (inputNameC.readOnly) inputNameC.value = getColorName(inputColorC.value); });

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        (async function init() {
            loadSettings();
            renderPanels();
            updateUI();

            const isActivated = await checkActivation();
            if (!isActivated) {
                appLocked = true;
                deviceIdDisplay.textContent = getDeviceId();
                paywallOverlay.classList.add('active');
            } else {
                appLocked = false;
                const trialInfoShown = localStorage.getItem('trialInfoShown');
                const activated = localStorage.getItem('activated') === 'true';
                if (!trialInfoShown && !activated) trialInfoOverlay.classList.add('active');
                updateTrialIndicator();
            }

            btnTrialOk.addEventListener('click', () => {
                trialInfoOverlay.classList.remove('active');
                localStorage.setItem('trialInfoShown', 'true');
            });

            btnActivate.addEventListener('click', async () => {
                const code = activationCodeInput.value.trim();
                if (!code) { paywallStatus.textContent = 'Введите код'; return; }
                const success = await activateDevice(code);
                if (success) {
                    appLocked = false;
                    paywallOverlay.classList.remove('active');
                    paywallStatus.textContent = '';
                    updateTrialIndicator();
                } else paywallStatus.textContent = 'Неверный код активации';
            });
            btnClosePaywall.addEventListener('click', () => {
                paywallOverlay.classList.remove('active');
                if (appLocked) setTimeout(() => { if (appLocked) paywallOverlay.classList.add('active'); }, 2000);
            });

            btnPlayPause.addEventListener('click', toggleMatch);
            btnReset.addEventListener('click', resetMatch);
            btnSettings.addEventListener('click', openSettings);
            btnEndGame.addEventListener('click', finishGame);
            btnSaveSettings.addEventListener('click', saveSettings);
            btnCloseSettings.addEventListener('click', closeSettings);
            modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeSettings(); });

            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
                switch(e.key.toLowerCase()) {
                    case 'a': capture('A'); e.preventDefault(); break;
                    case 'b': capture('B'); e.preventDefault(); break;
                    case 'c': if (state.teamCount === 3) capture('C'); e.preventDefault(); break;
                    case ' ': toggleMatch(); e.preventDefault(); break;
                    case 'r': resetMatch(); e.preventDefault(); break;
                    case 's': openSettings(); e.preventDefault(); break;
                    case 'escape': closeSettings(); break;
                }
            });

            document.documentElement.style.setProperty('--color-team-a', state.teamColors.A);
            document.documentElement.style.setProperty('--color-team-b', state.teamColors.B);
            document.documentElement.style.setProperty('--color-team-c', state.teamColors.C);
        })();
    </script>
</body>
</html>
